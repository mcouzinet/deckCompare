<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Compare — Results</title>
  <meta name="color-scheme" content="dark">
  <!-- Critical: theme.css is external, so the popup would paint white for one
       frame before it lands. One ground colour, kept in step with --felt. -->
  <style>html{background-color:#17120d}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* --- the mat ------------------------------------------------------------------ */
    .mat {
      max-width: 1320px; margin: 0 auto;
      padding: calc(var(--unit) * 3) var(--gutter) calc(var(--unit) * 6);
    }

    .mat-edge {
      display: flex; align-items: center; gap: calc(var(--unit) * 2);
      flex-wrap: wrap; row-gap: calc(var(--unit) * 1.5);
      padding: calc(var(--unit) * 2) var(--gutter);
      border-bottom: 1px solid var(--rule);
      max-width: 1320px; margin: 0 auto;
    }
    .mat-edge .spacer { flex: 1; }
    .edge-actions { display: flex; align-items: center; gap: var(--unit); }
    .tb-wrap { position: relative; }

    /* Buy me a coffee: it keeps its place and its link, and stops outshouting the
       primary action it sits next to. */
    .bmc {
      display: inline-flex; align-items: center; gap: var(--unit);
      padding: calc(var(--unit) * 1.2) calc(var(--unit) * 1.6);
      font-size: var(--fs-xs); font-weight: 600; text-decoration: none; white-space: nowrap;
      color: var(--warn); background: transparent;
      border: 1px solid var(--stitch); border-radius: 4px;
      transition: color .12s, border-color .12s;
    }
    .bmc svg { width: 15px; height: 15px; }
    .bmc:hover { color: var(--warn-hi); border-color: var(--warn); }

    /* --- the matchup, pressed into the felt --------------------------------------- */
    .matchup {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: var(--gutter);
      padding: calc(var(--unit) * 6) 0 calc(var(--unit) * 4);
    }
    .side { min-width: 0; }
    .side.b { text-align: right; }

    /* No eyebrow above the name: the deck's own ink says which side it is, and the
       stitched edge under it repeats that without a second label. */
    .deck-name {
      display: block;
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(var(--fs-lg), 2.6vw, var(--fs-xl));
      line-height: 1.15; letter-spacing: -0.02em;
      text-decoration: none; overflow-wrap: break-word;
    }
    .side.a .deck-name { color: var(--a); }
    .side.b .deck-name { color: var(--b); }
    a.deck-name:hover { text-decoration: underline; }
    .deck-edge { height: 2px; margin-top: calc(var(--unit) * 1.5); border-radius: 2px; }
    .side.a .deck-edge { background: linear-gradient(90deg, var(--a), transparent); }
    .side.b .deck-edge { background: linear-gradient(270deg, var(--b), transparent); }
    .deck-src {
      margin-top: var(--unit);
      font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-3);
    }

    /* The figure is the mat's own marking, debossed, not a dial floating in a panel. */
    .counter { display: flex; flex-direction: column; align-items: center; gap: calc(var(--unit) * 0.5); }
    .counter-well {
      display: grid; place-items: center;
      width: 148px; height: 148px; border-radius: 50%;
      background: var(--felt-deep); box-shadow: var(--press);
    }
    .counter-num {
      font-family: var(--font-display); font-weight: 800;
      font-size: var(--fs-2xl); line-height: 1; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .counter-num span { font-size: var(--fs-md); color: var(--ink-3); font-weight: 700; }
    .counter-label {
      font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-3);
    }

    /* --- the seam ----------------------------------------------------------------- */
    .seam { padding-bottom: calc(var(--unit) * 4); border-bottom: 1px solid var(--rule); }
    .seam-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--felt-deep); box-shadow: var(--press); }
    .seam-seg { height: 100%; }
    .seam-seg.a { background: var(--a); }
    .seam-seg.s { background: var(--match); }
    .seam-seg.b { background: var(--b); }
    .seam-legend {
      display: flex; justify-content: space-between; flex-wrap: wrap;
      gap: var(--unit); margin-top: calc(var(--unit) * 1.5); font-size: var(--fs-xs);
    }
    .lg { display: inline-flex; align-items: center; gap: var(--unit); color: var(--ink-3); }
    .lg .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
    .lg b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
    .lg.a .sw { background: var(--a); }
    .lg.s .sw { background: var(--match); }
    .lg.b .sw { background: var(--b); }

    /* --- controls ----------------------------------------------------------------- */
    .controls {
      display: flex; align-items: center; gap: var(--unit); flex-wrap: wrap;
      padding: calc(var(--unit) * 3) 0;
    }
    .controls .spacer { flex: 1; }

    /* --- the table: two sides, and the ground they share --------------------------- */
    .table-grid {
      display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: var(--gutter);
      align-items: start;
    }
    .sides { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--gutter); }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(var(--card-w,clamp(104px,9vw,148px)),1fr)); gap: calc(var(--unit) * 1.2); }

    /* Cards lie on the felt. Reaching for one lifts it — the light is overhead, so the
       shadow grows downward; nothing glows. */
    .card-slot {
      position: relative; aspect-ratio: 488/680; border-radius: 5px;
      background: var(--felt-deep); overflow: hidden; cursor: pointer;
      box-shadow: var(--lift-1);
      transition: transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s;
    }
    .card-slot:hover, .card-slot:focus-visible { transform: translateY(-3px); box-shadow: var(--lift-3); z-index: 2; }
    .card-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-slot.is-loading { background: var(--raised); }
    .card-slot .proxy-name {
      display: none; position: absolute; inset: 0; padding: calc(var(--unit) * 1.2);
      align-items: center; justify-content: center; text-align: center;
      font-size: var(--fs-micro); font-weight: 600; color: var(--ink-2);
      border: 1px dashed var(--stitch); border-radius: 5px;
    }
    .card-slot.is-proxy { background: var(--felt-lit); }
    .card-slot.is-proxy .proxy-name { display: flex; }
    .card-slot.is-proxy img { display: none; }
    .qty-badge, .board-tag {
      position: absolute; z-index: 1;
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: var(--fs-micro); font-weight: 700; line-height: 1;
      padding: 3px 6px; border-radius: 3px;
      color: var(--ink); background: rgba(13,10,6,.82);
    }
    .qty-badge { top: 5px; left: 5px; }
    .board-tag { bottom: 5px; right: 5px; color: var(--ink-3); font-size: var(--fs-micro); letter-spacing: .06em; }

    .type-divider {
      margin: calc(var(--unit) * 2.5) 0 calc(var(--unit) * 1.5);
      font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-3);
    }
    .col-empty { padding: calc(var(--unit) * 3) 0; font-size: var(--fs-xs); color: var(--ink-3); }

    /* --- the shared ground -------------------------------------------------------- */
    .shared { margin-top: calc(var(--unit) * 6); }
    .shared .zone-name, .shared .zone-count { color: var(--match); }
    .shared .zone-mark { border-bottom-color: var(--match-wash); }
    .shared-note { font-size: var(--fs-xs); color: var(--ink-3); display: inline-flex; align-items: center; gap: calc(var(--unit) * 0.8); }
    .shared-note .warn-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--warn); }

    .srow-head, .srow {
      display: grid;
      grid-template-columns: minmax(56px,0.9fr) minmax(0,2.2fr) auto minmax(56px,0.9fr);
      align-items: center; gap: calc(var(--unit) * 1.5); padding: 0 var(--unit);
    }
    .srow-head {
      height: 30px; font-size: var(--fs-micro); font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
      border-bottom: 1px solid var(--rule);
    }
    .srow-head .ca { color: var(--a); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow-head .cb { color: var(--b); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow-head .cc { text-align: center; }
    .srow {
      height: 36px; cursor: pointer;
      border-bottom: 1px solid rgba(244,238,227,0.03);
      transition: background .1s;
    }
    .srow:hover, .srow:focus-visible { background: var(--felt-lit); }
    .srow .qa, .srow .qb { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-sm); font-weight: 600; }
    .srow .qa { color: var(--a); }
    .srow .qb { color: var(--b); text-align: right; }
    .srow .nm { font-size: var(--fs-sm); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: var(--unit); }
    .srow .nm .bt { font-size: var(--fs-micro); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
    .srow .delta {
      justify-self: center; min-width: 40px; text-align: center;
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3);
    }
    .srow.diff .delta { color: var(--warn); }
    .srow-type-divider {
      padding: calc(var(--unit) * 2) var(--unit) var(--unit);
      font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-3);
    }

    /* --- the card you picked up ---------------------------------------------------- */
    .rail { position: sticky; top: calc(var(--unit) * 3); }
    .held {
      padding: calc(var(--unit) * 2);
      background: var(--felt-lit); border: 1px solid var(--stitch);
      border-radius: 6px; box-shadow: var(--lift-2);
    }
    .preview-stage {
      aspect-ratio: 488/680; border-radius: 5px; overflow: hidden;
      display: grid; place-items: center; position: relative;
      background: var(--felt-deep); box-shadow: var(--press);
    }
    .preview-stage img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .preview-stage.has-img img { display: block; }
    .preview-hint {
      display: flex; flex-direction: column; align-items: center; gap: var(--unit);
      padding: 0 calc(var(--unit) * 2); text-align: center;
      font-size: var(--fs-xs); color: var(--ink-3);
    }
    .preview-hint svg { width: 26px; height: 26px; opacity: .45; }
    .preview-stage.has-img .preview-hint { display: none; }
    .preview-name { margin-top: calc(var(--unit) * 1.5); font-family: var(--font-display); font-weight: 700; font-size: var(--fs-md); color: var(--ink); line-height: 1.2; }
    .preview-qty { margin-top: var(--unit); display: flex; flex-wrap: wrap; gap: var(--unit); font-size: var(--fs-xs); min-height: 22px; }
    .pq { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 3px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
    .pq.a { background: var(--a-wash); color: var(--a); }
    .pq.b { background: var(--b-wash); color: var(--b); }
    .pq i { font-style: normal; opacity: .7; font-family: var(--font-ui); }

    /* --- compare another ----------------------------------------------------------- */
    .another-pop {
      position: absolute; right: 0; top: calc(100% + var(--unit)); z-index: 60; width: 300px;
      display: flex; flex-direction: column; gap: var(--unit);
      padding: calc(var(--unit) * 1.5);
      background: var(--felt-lit); border: 1px solid var(--stitch);
      border-radius: 6px; box-shadow: var(--lift-3);
    }
    .another-pop[hidden] { display: none; }
    select.mat-field[hidden] { display: none; }
    .tb-msg { font-size: var(--fs-xs); color: var(--ink-3); }
    .tb-msg:empty { display: none; }
    .tb-msg.err { color: var(--brand); }

    /* --- list view ----------------------------------------------------------------- */
    body.view-list .card-grid { display: block; }
    body.view-list .card-slot {
      aspect-ratio: auto; height: 32px; border-radius: 0; box-shadow: none;
      display: flex; align-items: center; gap: var(--unit); padding: 0 var(--unit);
      background: transparent; border-bottom: 1px solid rgba(244,238,227,0.03);
    }
    body.view-list .card-slot:hover { transform: none; box-shadow: none; background: var(--felt-lit); }
    body.view-list .card-slot img, body.view-list .card-slot .qty-badge { display: none; }
    body.view-list .card-slot.is-loading { background: transparent; }
    body.view-list .card-slot .proxy-name {
      display: flex; position: static; inset: auto; border: 0; padding: 0;
      justify-content: flex-start; text-align: left; flex: 1;
      font-size: var(--fs-sm); color: var(--ink-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    body.view-list .card-slot.is-proxy { background: transparent; }
    body.view-list .card-slot::before {
      content: attr(data-qty) "×";
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3);
      min-width: 26px; flex: none;
    }
    body.view-list .card-slot .board-tag { position: static; background: none; padding: 0; order: 3; }

    #loading { padding: calc(var(--unit) * 10) 0; text-align: center; font-size: var(--fs-md); color: var(--ink-3); }
    .footnote {
      max-width: 1320px; margin: 0 auto;
      padding: calc(var(--unit) * 3) var(--gutter) calc(var(--unit) * 6);
      display: flex; align-items: center; gap: var(--unit);
      font-size: var(--fs-xs); color: var(--ink-3);
    }
    .footnote a { color: var(--ink-3); }

    @media (max-width: 1080px) {
      .table-grid { grid-template-columns: minmax(0,1fr); }
      .rail { position: static; max-width: 320px; }
    }
    @media (max-width: 760px) {
      .matchup { grid-template-columns: 1fr; gap: calc(var(--unit) * 2); text-align: center; }
      .side.b { text-align: center; }
      .side.a .deck-edge { background: var(--a); }
      .side.b .deck-edge { background: var(--b); }
      .counter { order: -1; }
      .sides { grid-template-columns: minmax(0,1fr); }
      .seam-legend { flex-direction: column; }
    }
  </style>
</head>
<body>
<!--
  DIRECTION CONTRACT — Deck Compare, results
  THESIS: A comparison read on the table it would be played on; it refuses the
    panel-inside-panel dashboard the category ships.
  OWN-WORLD: Warm felt under one overhead light. Areas are silkscreened with a rule and
    a name, never boxed and never nested. Deck 1 orange and deck 2 teal are the two sides
    of the mat, not accents. One button component. No element carries its own halo.
  STORY: The reader sees how far apart the two decks are before reading a word, walks
    each side's cards, then changes a deck without leaving the page.
  FIRST VIEWPORT: The similarity figure debossed into the felt at centre, the two deck
    names left and right in their own ink, the overlap seam beneath; Compare another at
    the mat's top edge.
  FORM: The Table — candidate 3 of 7 by resonance; seed 009366bf.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div class="mat-edge">
    <span class="wordmark">
      <img src="icons/icon48.png" alt="">
      <span>Deck<b>Compare</b></span>
    </span>
    <div class="spacer"></div>
    <a href="https://buymeacoffee.com/mcouzinet" target="_blank" rel="noopener" class="bmc" id="bmc-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M7 3v2M10.5 3v2M14 3v2"/></svg>
      <span id="bmc-text-compare"></span>
    </a>
    <div class="edge-actions">
      <button class="mat-btn" id="swap-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16H3m0 0 3-3m-3 3 3 3"/><path d="M17 8h4m0 0-3-3m3 3-3 3"/></svg>
        <span id="swap-text"></span>
      </button>
      <div class="tb-wrap">
        <button class="mat-btn mat-btn--go" id="another-btn" aria-expanded="false" aria-controls="another-pop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span id="another-text"></span>
        </button>
        <div class="another-pop" id="another-pop" hidden>
          <select class="mat-field" id="another-saved" hidden></select>
          <input class="mat-field" id="another-url" type="text">
          <button class="mat-btn mat-btn--go" id="another-go"></button>
          <div class="tb-msg" id="another-msg" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="mat">
    <div id="loading"></div>
    <div id="content" style="display:none">
      <h1 class="sr-only" id="results-heading"></h1>

      <section class="matchup">
        <div class="side a">
          <a class="deck-name" id="deck-a-name" target="_blank" rel="noopener">—</a>
          <div class="deck-edge"></div>
          <div class="deck-src" id="deck-a-src">—</div>
        </div>
        <div class="counter">
          <div class="counter-well">
            <div class="counter-num" id="ring-num"></div>
          </div>
          <div class="counter-label" id="ring-label"></div>
        </div>
        <div class="side b">
          <a class="deck-name" id="deck-b-name" target="_blank" rel="noopener">—</a>
          <div class="deck-edge"></div>
          <div class="deck-src" id="deck-b-src">—</div>
        </div>
      </section>

      <section class="seam">
        <div class="seam-bar" id="ring">
          <div class="seam-seg a" style="flex-basis:0%"></div>
          <div class="seam-seg s" style="flex-basis:0%"></div>
          <div class="seam-seg b" style="flex-basis:0%"></div>
        </div>
        <div class="seam-legend">
          <span class="lg a"><span class="sw"></span><span id="lg-a-label"></span> · <b id="lg-a">0</b></span>
          <span class="lg s"><span class="sw"></span><span id="lg-s-label"></span> · <b id="lg-s">0</b></span>
          <span class="lg b"><span class="sw"></span><span id="lg-b-label"></span> · <b id="lg-b">0</b></span>
        </div>
      </section>

      <div class="controls">
        <div class="segments" role="group">
          <button class="segment" data-board-filter="all" id="filter-all" aria-pressed="true"></button>
          <button class="segment" data-board-filter="commanders" id="filter-commanders" aria-pressed="false"></button>
          <button class="segment" data-board-filter="mainboard" id="filter-mainboard" aria-pressed="false"></button>
          <button class="segment" data-board-filter="sideboard" id="filter-sideboard" aria-pressed="false"></button>
        </div>
        <div class="spacer"></div>
        <div class="segments" role="group">
          <button class="segment" data-view="compact" id="view-compact" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/><rect x="19" y="3" width="2" height="6" rx="1"/><rect x="19" y="11" width="2" height="6" rx="1"/></svg>
          </button>
          <button class="segment" data-view="grid" id="view-grid" aria-pressed="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
          </button>
          <button class="segment" data-view="list" id="view-list" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
      </div>

      <div class="table-grid">
        <div>
          <h2 class="sr-only" id="exclusive-heading"></h2>
          <div class="sides">
            <div class="zone side-a">
              <div class="zone-mark">
                <span class="zone-name" id="col-a-title"></span>
                <span class="zone-count" id="col-a-count">0</span>
              </div>
              <div id="col-a-body"></div>
            </div>
            <div class="zone side-b">
              <div class="zone-mark">
                <span class="zone-name" id="col-b-title"></span>
                <span class="zone-count" id="col-b-count">0</span>
              </div>
              <div id="col-b-body"></div>
            </div>
          </div>

          <section class="shared zone">
            <div class="zone-mark">
              <h2 class="zone-name" id="shared-title"></h2>
              <span class="shared-note"><span class="warn-dot"></span><span id="qty-diff-note"></span></span>
              <span class="zone-count" id="shared-count">0</span>
            </div>
            <div class="srow-head">
              <span class="ca" id="srow-head-a"></span>
              <span id="srow-head-card"></span>
              <span class="cc">&Delta;</span>
              <span class="cb" id="srow-head-b"></span>
            </div>
            <div id="shared-body"></div>
          </section>
        </div>

        <aside class="rail">
          <div class="held">
            <div class="preview-stage" id="preview-stage">
              <img id="preview-img" alt="">
              <div class="preview-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <span id="hover-hint"></span>
              </div>
            </div>
            <div class="preview-name" id="preview-name"></div>
            <div class="preview-qty" id="preview-qty"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div class="footnote">
    <span id="footnote"></span>
    <span>·</span>
    <a id="rate-link" target="_blank" rel="noopener"></a>
  </div>

  <script src="shared.js"></script>
  <script src="compare.js"></script>
</body>
</html>
