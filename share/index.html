  <meta name="twitter:card" content="summary_large_image">
  <style>html{background-color:#f8f5f2}</style>
  <!-- A shared comparison's lasting address (Shared.shareLink in src/shared.js): the pair rides in
       the #, and this page only sends it on to the results page, so links outlive the files moving. -->
  <script>location.replace("../src/compare.html" + location.hash);</script>
</head>
