<!DOCTYPE html>
<html>
<head><title>Krenko Test Deck // Back Face | Melee</title></head>
<body>
  <!-- Mustache template: its placeholder rows MUST be stripped before counting. -->
  <script id="hovercard-template" type="x-tmpl-mustache">
    <div class="decklist-category">
      <div class="decklist-category-title">Creature ({{Count}})</div>
      <div class="decklist-category-records">
        <div class="decklist-record">
          <span class="decklist-record-quantity">9</span>
          <a class="decklist-record-name" href="/Card/View/x">{{Name}}</a>
        </div>
      </div>
    </div>
  </script>

  <div class="decklist-container three-column">
    <div class="decklist-category">
      <div class="decklist-category-title">Commander (1)</div>
      <hr class="decklist-category-divider"/>
      <div class="decklist-category-records">
        <div class="decklist-record">
          <span class="decklist-record-quantity">1</span>
          <a class="decklist-record-name" href="/Card/View/terra">Terra, Magical Adept // Esper Terra</a>
        </div>
      </div>
    </div>
    <div class="decklist-category">
      <div class="decklist-category-title">Creature (2)</div>
      <div class="decklist-category-records">
        <div class="decklist-record">
          <span class="decklist-record-quantity">1</span>
          <a class="decklist-record-name" href="/Card/View/gg">Goblin Guide</a>
        </div>
        <div class="decklist-record">
          <span class="decklist-record-quantity">1</span>
          <a class="decklist-record-name" href="/Card/View/sfi">Sword of Fire &amp; Ice</a>
        </div>
      </div>
    </div>
    <div class="decklist-category">
      <div class="decklist-category-title">Land (2)</div>
      <div class="decklist-category-records">
        <div class="decklist-record">
          <span class="decklist-record-quantity">2</span>
          <a class="decklist-record-name" href="/Card/View/mtn">Mountain</a>
        </div>
      </div>
    </div>
    <div class="decklist-category">
      <div class="decklist-category-title">Sideboard (1)</div>
      <div class="decklist-category-records">
        <div class="decklist-record">
          <span class="decklist-record-quantity">1</span>
          <a class="decklist-record-name" href="/Card/View/pyro">Pyroblast</a>
        </div>
      </div>
    </div>
    <div class="decklist-category">
      <div class="decklist-category-title">Companion (1)</div>
      <div class="decklist-category-records">
        <div class="decklist-record">
          <span class="decklist-record-quantity">1</span>
          <a class="decklist-record-name" href="/Card/View/jeg">Jegantha, the Wellspring</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
