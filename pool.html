<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Compare</title>
  <meta name="color-scheme" content="dark">
  <!-- Critical: theme.css is external, so the popup would paint white for one
       frame before it lands. One ground colour, kept in step with --felt. -->
  <style>html{background-color:#17120d}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      /* Palette, type ramp, reset and browser surfaces come from theme.css. Only what
         this page alone owns stays here. */
      --W:#f6f0d2; --U:#4a90d9; --K:#8270a8; --R:#d9534a; --G:#5aa469;
      --radius:6px; --radius-sm:4px;
      --warn-soft:rgba(230,181,78,0.14);
      --brand-hi:var(--brand-btn-hi);
    }
    body { font-size:var(--fs-md); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }

    .topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:16px;
      padding:14px 28px; background:var(--felt); border-bottom:1px solid var(--rule); }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { width:30px; height:30px; border-radius:var(--radius); }
    .brand-name { font-family:var(--font-display); font-weight:700; font-size:var(--fs-lg); letter-spacing:-0.01em; color:var(--a); }
    .brand-name b { color:var(--b); font-weight:800; }
    .topbar-spacer { flex:1; }
    .topbar-meta { font-size:var(--fs-xs); color:var(--ink-3); }

    .shell { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:28px; max-width:1320px; margin:0 auto; padding:28px; align-items:start; }
    @media (max-width:1000px){ .shell{ grid-template-columns:minmax(0,1fr);} .rail{ display:none !important;} }

    .panel { padding:20px 0; border-bottom:1px solid var(--rule); margin-bottom:20px; }
    h1 { font-family:var(--font-display); font-weight:700; font-size:var(--fs-xl); color:var(--ink); letter-spacing:-0.015em; }
    .sub { color:var(--ink-3); font-size:var(--fs-sm); margin-top:4px; }

    label.fld { display:block; font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.1em; font-weight:600; color:var(--ink-3); margin:14px 0 6px; }
    textarea { width:100%; background:var(--felt-deep); border:1px solid var(--rule); border-radius:var(--radius-sm);
      padding:11px 12px; color:var(--ink-2); font-family:var(--font-mono); font-size:var(--fs-sm); resize:vertical; }
    textarea:focus { outline:none; border-color:var(--a); }
    .or { display:flex; align-items:center; gap:12px; margin:14px 0; color:var(--ink-3); font-size:var(--fs-xs); }
    .or::before,.or::after { content:""; flex:1; height:1px; background:var(--rule); }
    .run-row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
    .count { font-size:var(--fs-xs); color:var(--ink-3); }
    .err { color:var(--brand-hi); font-size:var(--fs-sm); margin-top:10px; }
    .add-toggle { width:100%; padding:10px; border:1px dashed var(--stitch); background:none; color:var(--ink-3);
      border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font-ui); font-weight:600; font-size:var(--fs-sm); transition:all 0.14s; }
    .add-toggle:hover { border-color:var(--a); color:var(--a); }
    #input-panel { position:relative; }
    .fields-close { position:absolute; top:12px; right:12px; z-index:2; border:0; background:var(--raised); color:var(--ink-3);
      width:26px; height:26px; border-radius:var(--radius); cursor:pointer; font-size:var(--fs-lg); line-height:1; transition:all 0.14s; }
    .fields-close:hover { color:var(--brand-hi); background:var(--brand-wash); }

    /* hero */
    .hero { display:flex; gap:18px; align-items:flex-start; }
    .hero-art { width:150px; aspect-ratio:488/680; border-radius:var(--radius); flex-shrink:0; overflow:hidden;
      background:repeating-linear-gradient(45deg,var(--felt-lit) 0 10px,var(--felt) 10px 20px); }
    .hero-art img { width:100%; height:100%; object-fit:cover; display:none; }
    .hero-art.has img { display:block; }
    .hero-role { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.13em; font-weight:600; color:var(--a); margin-top:6px; }
    .hero h2 { font-family:var(--font-display); font-weight:700; font-size:clamp(var(--fs-lg),2.2vw,var(--fs-xl)); color:var(--ink); letter-spacing:-0.015em; line-height:1.15; }
    .cpips { display:inline-flex; gap:4px; margin-top:8px; }
    .cpip { width:16px; height:16px; border-radius:50%; border:1px solid var(--felt-deep); }
    .cpip.W{background:var(--W);} .cpip.U{background:var(--U);} .cpip.B{background:var(--K);} .cpip.R{background:var(--R);} .cpip.G{background:var(--G);} .cpip.C{background:var(--raised-hi);}
    .stats { display:flex; gap:26px; margin-top:16px; flex-wrap:wrap; }
    .stat .n { font-family:var(--font-display); font-weight:800; font-size:var(--fs-xl); color:var(--ink); line-height:1; }
    .stat .n.accent { color:var(--a); }
    .stat .l { font-size:var(--fs-micro); color:var(--ink-3); margin-top:3px; }
    .legend { margin-top:16px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .legend .lbl { font-size:var(--fs-micro); color:var(--ink-3); margin-right:2px; }
    .chip { display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-micro); padding:2px 4px 2px 9px; border-radius:999px;
      background:var(--raised); border:1px solid var(--rule); color:var(--ink-2); max-width:280px; }
    .chip-link { text-decoration:none; color:inherit; max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    a.chip-link:hover { color:var(--a); }
    .chip .hsh { color:var(--ink-3); }
    .chip-x { border:0; background:none; color:var(--ink-3); cursor:pointer; font-size:var(--fs-md); line-height:1; padding:0 4px; border-radius:50%; }
    .chip-x:hover { color:var(--brand-hi); background:var(--brand-wash); }
    .errbox { margin-top:12px; font-size:var(--fs-xs); color:var(--ink-3); background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--radius); padding:8px 11px; line-height:1.6; }
    .errbox b { color:var(--warn); font-weight:600; }

    /* decks-in-pool panel (right rail) */
    .deckpanel { background:var(--felt); border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; }
    .dp-head { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--rule);
      font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-3); font-weight:600; }
    .dp-c { margin-left:auto; font-family:var(--font-mono); background:var(--raised); color:var(--ink-3); padding:1px 8px; border-radius:999px; font-size:var(--fs-micro); }
    .dp-item { display:flex; align-items:center; gap:6px; padding:8px 10px 8px 12px; border-bottom:1px solid rgba(255,255,255,0.03); }
    .dp-item:last-child { border-bottom:0; }
    .dp-item:hover { background:rgba(255,255,255,0.025); }
    .dp-link { flex:1; min-width:0; text-decoration:none; color:var(--ink-2); display:flex; align-items:baseline; gap:7px; }
    a.dp-link:hover .dp-n { color:var(--a); }
    .dp-n { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-sm); }
    .dp-hash { color:var(--ink-3); font-family:var(--font-mono); font-size:var(--fs-micro); flex-shrink:0; }
    .dp-src { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-3); margin-left:auto; flex-shrink:0; }
    .dp-x { border:0; background:none; color:var(--ink-3); cursor:pointer; font-size:var(--fs-lg); line-height:1; padding:0 5px; border-radius:5px; flex-shrink:0; }
    .dp-x:hover { color:var(--brand-hi); background:var(--brand-wash); }
    .dp-errs { padding:9px 12px; border-top:1px solid var(--rule); font-size:var(--fs-micro); color:var(--ink-3); background:var(--warn-soft); line-height:1.5; }
    .dp-errs b { display:block; color:var(--warn); margin-bottom:3px; font-weight:600; }
    .dp-err { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* controls */
    .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .segmented { display:inline-flex; background:var(--felt-lit); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:3px; gap:2px; }
    .seg-btn { border:0; background:transparent; color:var(--ink-3); font-family:var(--font-ui); font-size:var(--fs-sm); font-weight:600;
      padding:6px 13px; border-radius:6px; cursor:pointer; transition:all .14s; white-space:nowrap; }
    .seg-btn:hover { color:var(--ink-2); }
    .seg-btn.active { background:var(--raised-hi); color:var(--ink); }
    .pills { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    .pill { border:1px solid var(--rule); background:var(--felt-lit); color:var(--ink-3); font-size:var(--fs-xs); padding:5px 11px;
      border-radius:999px; cursor:pointer; transition:all .14s; }
    .pill:hover { color:var(--ink-2); }
    .pill.active { background:var(--a); color:var(--felt-deep); border-color:transparent; font-weight:600; }

    /* sections */
    .sect { background:var(--felt); border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; margin-bottom:18px; }
    .sect-head { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule); }
    .sect-title { font-size:var(--fs-xs); font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink); }
    .sect-title .c { color:var(--ink-3); font-weight:600; }
    .sect-note { font-size:var(--fs-micro); color:var(--ink-3); text-transform:none; letter-spacing:0; font-weight:500; }
    .sect-actions { margin-left:auto; display:flex; gap:14px; }
    .lnk { background:none; border:0; color:var(--ink-3); font-size:var(--fs-xs); cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-family:var(--font-ui); }
    .lnk:hover { color:var(--ink); }
    .lnk svg { width:13px; height:13px; }

    .prow { display:flex; align-items:center; gap:10px; padding:7px 14px; border-bottom:1px solid rgba(255,255,255,0.03); }
    .prow:last-child { border-bottom:0; }
    .prow:hover { background:rgba(255,255,255,0.025); }
    .prow input[type=checkbox] { accent-color:var(--a); cursor:pointer; flex-shrink:0; }
    .prow .nm { flex:1; min-width:0; font-size:var(--fs-sm); color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:default; }
    .prow .xq { font-size:var(--fs-micro); color:var(--ink-3); margin-left:5px; }
    .prow .cp { background:none; border:0; color:var(--ink-3); cursor:pointer; flex-shrink:0; display:inline-flex; }
    .prow .cp:hover { color:var(--ink); }
    .prow .cp svg { width:14px; height:14px; }
    .prow .pct { font-family:var(--font-mono); font-size:var(--fs-sm); font-weight:600; color:var(--ink); width:46px; text-align:right; flex-shrink:0; }
    .prow .frac { font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--ink-3); width:42px; text-align:right; flex-shrink:0; }
    .pbadges { display:flex; flex-wrap:wrap; gap:3px; padding:0 14px 8px 38px; }
    .pbadge { font-family:var(--font-mono); font-size:var(--fs-micro); padding:1px 5px; border-radius:4px; background:var(--raised); color:var(--ink-3); text-decoration:none; }
    a.pbadge:hover { background:var(--raised-hi); color:var(--ink); }
    .bar { flex:1; height:6px; border-radius:3px; background:var(--raised); overflow:hidden; max-width:120px; }
    .bar > i { display:block; height:100%; background:var(--a); border-radius:3px; }
    .type-divider { display:flex; align-items:center; gap:10px; padding:10px 14px 4px; }
    .type-divider span { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; font-weight:600; color:var(--ink-3); }
    .empty { padding:28px; text-align:center; color:var(--ink-3); }

    /* mana curve */
    .curve { background:var(--felt); border:1px solid var(--rule); border-radius:var(--radius); padding:14px 16px; }
    .curve h3 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-3); font-weight:600; margin-bottom:12px; }
    .bars { display:flex; align-items:flex-end; gap:6px; height:110px; }
    .bars .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
    .bars .col .v { font-size:var(--fs-micro); color:var(--ink-3); }
    .bars .col .b { width:100%; background:rgba(227,162,79,0.7); border-radius:4px 4px 0 0; min-height:2px; }
    .bars .col .x { font-size:var(--fs-micro); color:var(--ink-3); }
    .curve .cap { font-size:var(--fs-micro); color:var(--ink-3); text-align:center; margin-top:10px; }

    /* right rail preview */
    .rail { position:sticky; top:84px; display:flex; flex-direction:column; gap:16px; }
    .preview-card { background:var(--felt-lit); border:1px solid var(--stitch); border-radius:var(--radius); padding:16px; box-shadow:var(--lift-2); }
    .preview-stage { aspect-ratio:488/680; border-radius:var(--radius); background:repeating-linear-gradient(45deg,var(--felt-lit) 0 10px,var(--felt) 10px 20px);
      display:grid; place-items:center; overflow:hidden; }
    .preview-stage img { width:100%; height:100%; object-fit:contain; display:none; filter:drop-shadow(0 12px 30px rgba(0,0,0,0.6)); }
    .preview-stage.has img { display:block; }
    .preview-hint { color:var(--ink-3); font-size:var(--fs-xs); text-align:center; padding:0 20px; }
    .preview-stage.has .preview-hint { display:none; }
    .preview-name { font-family:var(--font-display); font-weight:700; font-size:var(--fs-md); color:var(--ink); margin-top:12px; min-height:20px; }

    /* selection bar */
    .selbar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:50; display:none;
      align-items:center; gap:16px; background:var(--felt-lit); border:1px solid var(--stitch); border-radius:999px;
      padding:9px 10px 9px 18px; box-shadow:var(--lift-3); }
    .selbar.show { display:flex; }
    .selbar .n { font-size:var(--fs-sm); color:var(--ink); }
    .footnote { max-width:1320px; margin:0 auto; padding:4px 28px 40px; font-size:var(--fs-xs); color:var(--ink-3); }
    #loading { text-align:center; padding:50px; color:var(--ink-3); }
    .hide { display:none !important; }

    :focus-visible { outline: 2px solid var(--b); outline-offset: 2px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
<!--
  DIRECTION CONTRACT — Deck Compare, pool
  THESIS: One pool of decks laid out on the same table, so what every list agrees on
    reads as a shared area rather than as a dashboard tile.
  OWN-WORLD: Warm felt under one overhead light. Areas are silkscreened with a rule and
    a name, never boxed and never nested. Deck 1 orange and deck 2 teal are the two sides
    of the mat, not accents. One button component. No element carries its own halo.
  STORY: The reader sees the commander, then how much of the pool agrees with it, then
    which cards are consensus and which are the flex slots.
  FIRST VIEWPORT: The commander and its counts across the top of the mat, the usage list
    beneath, the held card at the right edge.
  FORM: The Table — candidate 3 of 7 by resonance; seed 009366bf.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div class="topbar">
    <div class="brand"><img class="brand-mark" src="icons/icon48.png" alt=""><span class="brand-name">Deck<b>Compare</b></span></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-meta" id="topbar-meta"></div>
  </div>

  <div class="shell">
    <main>
      <!-- input -->
      <section class="panel" id="input-panel">
        <button class="mat-btn mat-btn--flat mat-btn--icon fields-close hide" id="fields-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div id="intro">
          <h1 id="intro-title"></h1>
          <p class="sub" id="intro-sub"></p>
        </div>
        <button class="mat-btn add-toggle hide" id="add-toggle"></button>
        <div id="input-fields">
          <label class="fld" id="links-label"></label>
          <textarea id="urls" rows="5" spellcheck="false" placeholder="https://www.moxfield.com/decks/...&#10;https://archidekt.com/decks/...&#10;https://www.mtgtop8.com/event?e=...&d=..."></textarea>
          <div class="or" id="or-paste-text"></div>
          <textarea id="texts" rows="4" spellcheck="false" placeholder="Commander&#10;1 Krenko, Mob Boss&#10;&#10;Deck&#10;1 Lightning Bolt&#10;..."></textarea>
          <div class="run-row">
            <span class="count" id="count">0</span>
            <button class="mat-btn mat-btn--go" id="run" disabled></button>
          </div>
          <p class="err hide" id="err"></p>
        </div>
      </section>

      <div id="loading" class="hide"></div>

      <!-- results -->
      <div id="results" class="hide">
        <section class="panel hero" id="hero">
          <div class="hero-art" id="hero-art"><img id="hero-img" alt=""></div>
          <div style="flex:1; min-width:0">
            <h2 id="hero-name">—</h2>
            <div class="hero-role" id="hero-eyebrow"></div>
            <div class="cpips" id="hero-pips"></div>
            <div class="stats" id="hero-stats"></div>
          </div>
        </section>

        <div class="controls">
          <div class="segmented" id="view-seg">
            <button class="seg-btn active" data-view="usage"><span id="view-usage-text"></span></button>
            <button class="seg-btn" data-view="average"><span id="view-average-text"></span></button>
          </div>
        </div>

        <div id="usage-view">
          <div class="pills" id="cat-pills"></div>
          <div id="sections"></div>
        </div>

        <div id="average-view" class="hide"></div>
      </div>
    </main>

    <aside class="rail">
      <div class="deckpanel" id="deck-panel"></div>
      <div class="preview-card">
        <div class="preview-stage" id="pv-stage">
          <img id="pv-img" alt="">
          <div class="preview-hint" id="preview-hint"></div>
        </div>
        <div class="preview-name" id="pv-name"></div>
      </div>
      <div id="curve-slot"></div>
      <div id="side-slot"></div>
    </aside>
  </div>

  <div class="selbar" id="selbar">
    <span class="n" id="sel-n">0</span>
    <button class="lnk" id="sel-copy" style="color:var(--a)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M4 13V4.5A1.5 1.5 0 0 1 5.5 3H13"/></svg> <span id="sel-copy-text"></span></button>
    <button class="lnk" id="sel-clear"></button>
  </div>

  <div class="footnote" id="pool-footnote"></div>

  <script src="shared.js"></script>
  <script src="enrich.js"></script>
  <script src="pool-analyze.js"></script>
  <script src="pool.js"></script>
</body>
</html>
