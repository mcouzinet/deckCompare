<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Compare</title>
  <meta name="color-scheme" content="light">
  <!-- Critical: theme.css is external, so the popup would paint white for one
       frame before it lands. One ground colour, kept in step with --bg. -->
  <style>html{background-color:#f8f5f2}</style>
  <!-- The card images' host: its connection is open before the first card asks. -->
  <link rel="preconnect" href="https://cards.scryfall.io">
  <!-- The fonts that paint first: the interface and the wordmark. -->
  <link rel="preload" href="fonts/Archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/GeistMono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Beleren sets the figures and names that land first; requested from the stylesheet, it
       arrived after them and they drew in the fallback serif for a frame. -->
  <link rel="preload" href="fonts/Beleren2016-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* --- the sheet ---------------------------------------------------------------- */
    .mat {
      max-width: 1280px; margin: 0 auto;
      padding: calc(var(--unit) * 3) var(--gutter) calc(var(--unit) * 6);
    }

    .mat-edge {
      display: flex; align-items: center; gap: calc(var(--unit) * 2);
      flex-wrap: wrap; row-gap: calc(var(--unit) * 1.5);
      padding: calc(var(--unit) * 2) var(--gutter);
      border-bottom: 1px solid var(--line);
      max-width: 1280px; margin: 0 auto;
    }
    .mat-edge .spacer { flex: 1; }
    .edge-actions { display: flex; align-items: center; gap: var(--unit); }
    .tb-wrap { position: relative; }

    /* Buy me a coffee: a quiet pill beside the actions. */
    .bmc {
      display: inline-flex; align-items: center; gap: var(--unit);
      padding: calc(var(--unit) * 1.1) calc(var(--unit) * 1.75);
      font-size: var(--fs-xs); font-weight: 600; text-decoration: none; white-space: nowrap;
      color: var(--ink-2); background: transparent;
      border: 1px solid var(--line-strong); border-radius: var(--r-pill);
      transition: color .12s, border-color .12s, background .12s;
    }
    .bmc svg { width: 15px; height: 15px; }
    .bmc:hover { color: var(--b); border-color: var(--b); background: var(--elev); }

    /* --- the matchup: two names, and the figure between them ----------------------- */
    .matchup {
      display: grid; grid-template-columns: 1fr auto 1fr;
      /* Bottoms aligned: a long name grows upward, and the two sources and the figure's
         caption stay on one line. */
      align-items: end; gap: var(--gutter);
      padding: calc(var(--unit) * 7) 0 calc(var(--unit) * 4);
    }
    .side { min-width: 0; }
    .side.b { text-align: right; }

    /* The deck's own ink says which side it is; the short rule under it repeats that. */
    /* Two lines at most: a tournament title ("House of Middle Earth @ MTGSpecs (Ep. 1): …")
       ran to three and pushed the figure off centre. The full name is the link's title. */
    .deck-name {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
      font-family: var(--font-display); font-weight: 400;
      font-size: clamp(22px, 2.8vw, 36px);
      line-height: 1.1; letter-spacing: -0.01em;
      text-decoration: none; overflow-wrap: break-word;
    }
    .side.a .deck-name { color: var(--a); }
    .side.b .deck-name { color: var(--b); }
    /* Right-aligned, the clamp's ellipsis (and a final letter's tail) fell outside the clipped
       box, so a cut name read as whole: room for them, given back by the margin. */
    .side.b .deck-name { padding-right: 1em; margin-right: -1em; }
    a.deck-name:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }
    .deck-edge { width: 40px; height: 2px; margin-top: calc(var(--unit) * 2); border-radius: 2px; }
    .side.a .deck-edge { background: var(--a); }
    .side.b .deck-edge { background: var(--b); margin-left: auto; }
    .deck-src {
      margin-top: calc(var(--unit) * 1.25);
      font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-3);
    }

    /* The figure sits on the paper like a memo's headline number. */
    .counter { display: flex; flex-direction: column; align-items: center; gap: calc(var(--unit) * 0.75); padding: 0 calc(var(--unit) * 3); }
    .counter-well { display: grid; place-items: center; }
    .counter-num {
      font-family: var(--font-display); font-weight: 400;
      font-size: clamp(40px, 6vw, 80px); line-height: 1; letter-spacing: -0.01em; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .counter-num span { font-size: 0.42em; color: var(--ink-3); letter-spacing: 0; margin-left: 2px; }
    .counter-label {
      font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-3);
    }
    /* What the figure counts: "22 cards in common out of 100". */
    .counter-basis { font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* --- the overlap bar ---------------------------------------------------------- */
    .seam { padding-bottom: calc(var(--unit) * 4); border-bottom: 1px solid var(--line); }
    .seam-bar { display: flex; height: 8px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; background: var(--bg-deep); }
    /* The page's one authored moment: the bar draws in once, left to right, the instant the
       result is revealed — the gap between the decks is seen before a word is read. */
    .seam-seg { height: 100%; transform-origin: left center; animation: seam-draw .9s cubic-bezier(.22,1,.36,1) both; }
    .seam-seg.ax { animation-delay: .06s; }
    .seam-seg.s { animation-delay: .12s; }
    .seam-seg.bx { animation-delay: .18s; }
    .seam-seg.b { animation-delay: .24s; }
    @keyframes seam-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .seam-seg.a { background: var(--a); }
    .seam-seg.s { background: var(--match); }
    .seam-seg.b { background: var(--b); }
    /* Surplus copies of shared cards (10 Forests against 6): the side's ink, lighter, next to
       the shared ground. Without them one side's segments fell short of its deck. */
    .seam-seg.ax { background: var(--a); opacity: .42; }
    .seam-seg.bx { background: var(--b); opacity: .42; }
    .seam-legend {
      display: flex; justify-content: space-between;
      gap: calc(var(--unit) * 3); margin-top: calc(var(--unit) * 1.5); font-size: var(--fs-xs);
    }
    .lg { display: inline-flex; align-items: center; gap: var(--unit); color: var(--ink-3); white-space: nowrap; text-decoration: none; }
    /* Each entry jumps to its cards: the shared table sits under both grids, thousands of
       pixels down with a hundred-card deck. */
    .lg:hover .lg-label, .lg:focus-visible .lg-label { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .zone { scroll-margin-top: calc(var(--unit) * 2); }
    /* A side's label is the one part that yields: "Only in <a long name>" ends in an ellipsis
       (its title keeps the whole) and the counts after it always show. */
    .lg.a, .lg.b { min-width: 0; }
    .lg > * { flex: none; }
    .lg > .lg-label { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .lg .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
    .lg b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
    .lg.a .sw { background: var(--a); }
    .lg.s .sw { background: var(--match); }
    .lg.b .sw { background: var(--b); }
    .lg.x .sw { opacity: .42; }   /* its colour is set per pair (compare.js): the side(s) with surplus */

    /* --- controls ----------------------------------------------------------------- */
    .controls {
      display: flex; align-items: center; gap: var(--unit); flex-wrap: wrap;
      padding: calc(var(--unit) * 3) 0;
    }
    .controls .spacer { flex: 1; }

    /* --- the table: two sides, and the ground they share --------------------------- */
    .table-grid {
      display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: var(--gutter);
      align-items: start;
    }
    .sides { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--gutter); }

    /* At least three cards a side, 96px when there is room (125px from 1280px up, four at
       1024). The old viewport-based
       minimum jumped with the window (125px cards at 1366, 192px from 1440, so the page doubled
       in length when widening it); the held card is where a card is read. */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(var(--card-w,min(96px,calc((100% - 20px) / 3))),1fr)); gap: calc(var(--unit) * 1.25); }

    /* Cards lie on the paper. Reaching for one lifts it; the shadow grows downward. */
    .card-slot {
      position: relative; aspect-ratio: 488/680; border-radius: var(--r-sm);
      background: var(--bg-deep); overflow: hidden; cursor: pointer;
      box-shadow: var(--lift-1);
      transition: transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s;
    }
    .card-slot:hover, .card-slot:focus-visible { transform: translateY(-3px); box-shadow: var(--lift-3); z-index: 2; }
    .card-slot img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 4.7% / 3.4%; }
    .card-slot.is-loading { background: var(--bg-deep); }
    .card-slot .proxy-name {
      display: none; position: absolute; inset: 0; padding: calc(var(--unit) * 1.2);
      align-items: center; justify-content: center; text-align: center;
      font-size: var(--fs-micro); font-weight: 600; color: var(--ink-2);
      border: 1px dashed var(--line-strong); border-radius: inherit;
    }
    .card-slot.is-proxy { background: var(--elev); }
    .card-slot.is-proxy .proxy-name { display: flex; }
    .card-slot.is-proxy img { display: none; }
    .qty-badge, .board-tag {
      position: absolute; z-index: 1;
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: var(--fs-micro); font-weight: 700; line-height: 1;
      padding: 3px 7px; border-radius: var(--r-xs);
      color: #fff; background: rgba(36,28,24,.82);
    }
    .qty-badge { top: 6px; left: 6px; }
    .board-tag { bottom: 6px; right: 6px; color: rgba(255,255,255,.8); font-size: var(--fs-micro); letter-spacing: .06em; }

    .type-divider {
      margin: calc(var(--unit) * 2.5) 0 calc(var(--unit) * 1.5);
      font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-3);
    }
    .col-empty { padding: calc(var(--unit) * 3) 0; font-size: var(--fs-xs); color: var(--ink-3); }
    /* A side's name holds one line whatever the deck is called, so the two zones start level. */
    .sides .zone-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* A zone's count copies its cards as "qty name" lines, the import format of every deck
       builder. The icon is a tool, so it stays in Ink Mute; "copied!" takes the action ink. */
    .zone-copy {
      margin-left: auto; margin-right: calc(var(--unit) * -0.75); flex: none;
      display: inline-flex; align-items: center; gap: calc(var(--unit) * 0.75);
      padding: 2px calc(var(--unit) * 0.75);
      background: none; border: 0; border-radius: var(--r-xs); font: inherit; cursor: pointer; color: var(--ink-3);
    }
    .zone-copy .zone-count { margin-left: 0; }
    .zone-copy svg { width: 13px; height: 13px; opacity: .6; transition: opacity .12s; }
    .zone-copy:hover svg, .zone-copy:focus-visible svg { opacity: 1; }
    .zone-copy:hover .zone-count, .zone-copy:focus-visible .zone-count { text-decoration: underline; text-underline-offset: 3px; }
    .zone-copy .zc-done { display: none; font-size: var(--fs-xs); font-weight: 600; color: var(--brand-btn); }
    .zone-copy.copied .zc-done { display: inline; }
    .zone-copy.copied .zone-count, .zone-copy.copied svg { display: none; }
    .zone-copy:disabled { cursor: default; }
    .zone-copy:disabled svg { display: none; }

    /* --- the shared ground -------------------------------------------------------- */
    .shared { margin-top: calc(var(--unit) * 6); }
    .shared .zone-name, .shared .zone-count { color: var(--match); }
    .shared .zone-mark { border-bottom-color: var(--match-wash); }
    /* "N quantity mismatches" is a toggle: pressed, the table keeps only those rows (a Forest
       at -5 hid among twenty-five "=" rows). */
    .shared-note {
      font: inherit; font-size: var(--fs-xs); color: var(--ink-3); cursor: pointer;
      display: inline-flex; align-items: center; gap: calc(var(--unit) * 0.8);
      padding: 2px calc(var(--unit) * 0.75); margin-left: calc(var(--unit) * -0.75);
      background: none; border: 0; border-radius: var(--r-xs);
    }
    .shared-note:hover, .shared-note:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .shared-note[aria-pressed="true"] { color: var(--brand-btn); font-weight: 600; }   /* selected: the action ink */
    .shared-note[aria-pressed="false"] .note-off { display: none; }   /* pressed, it says how to undo it */
    .shared-note .warn-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--brand); }
    body.diffs-only .srow:not(.diff) { display: none; }

    .srow-head, .srow {
      display: grid;
      grid-template-columns: minmax(56px,0.9fr) minmax(0,2.2fr) auto minmax(56px,0.9fr);
      align-items: center; gap: calc(var(--unit) * 1.5); padding: 0 var(--unit);
    }
    .srow-head {
      height: 30px; font-size: var(--fs-micro); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
      border-bottom: 1px solid var(--line);
    }
    .srow-head .ca { color: var(--a); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow-head .cb { color: var(--b); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow-head .cc { text-align: center; }
    .srow {
      height: 38px; cursor: pointer; border-radius: var(--r-xs);
      border-bottom: 1px solid var(--line);
      transition: background .1s;
    }
    .srow:hover, .srow:focus-visible { background: var(--elev); }
    .srow .qa, .srow .qb { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-sm); font-weight: 600; }
    .srow .qa { color: var(--a); }
    .srow .qb { color: var(--b); text-align: right; }
    .srow .nm { font-size: var(--fs-sm); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: var(--unit); }
    .srow .nm .bt { font-size: var(--fs-micro); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
    .srow .delta {
      justify-self: center; min-width: 40px; text-align: center;
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3);
    }
    .srow.diff .delta { color: var(--brand); }
    .srow-type-divider {
      padding: calc(var(--unit) * 2) var(--unit) var(--unit);
      font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-3);
    }

    /* --- the card you picked up ---------------------------------------------------- */
    .rail { position: sticky; top: calc(var(--unit) * 3); }
    /* Nothing held: the sheet rests (lift-1) and its stage folds to the hint, instead of a
       card-sized blank beside the grids. Picking a card up raises it. */
    .held {
      padding: calc(var(--unit) * 2);
      background: var(--elev); border: 1px solid var(--line);
      border-radius: var(--r-lg); box-shadow: var(--lift-1);
      transition: box-shadow .18s;
    }
    .held:has(.preview-stage.has-img) { box-shadow: var(--lift-2); }
    .preview-stage:not(.has-img) { aspect-ratio: auto; padding: calc(var(--unit) * 3) 0; }
    .preview-stage {
      aspect-ratio: 488/680; border-radius: var(--r-sm); overflow: hidden;
      display: grid; place-items: center; position: relative;
      background: var(--bg-deep);
    }
    .preview-stage img { width: 100%; height: 100%; object-fit: contain; display: none; border-radius: 4.7% / 3.4%; }
    .preview-stage.has-img img { display: block; }
    .preview-hint {
      display: flex; flex-direction: column; align-items: center; gap: var(--unit);
      padding: 0 calc(var(--unit) * 2); text-align: center;
      font-size: var(--fs-xs); color: var(--ink-2);   /* Ink Mute is 4.1:1 on the well: short of AA */
    }
    .preview-hint svg { width: 26px; height: 26px; opacity: .45; }
    .preview-stage.has-img .preview-hint { display: none; }
    .preview-name { margin-top: calc(var(--unit) * 1.75); font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: 0; color: var(--ink); line-height: 1.25; }
    .preview-qty { margin-top: var(--unit); display: flex; flex-wrap: wrap; gap: var(--unit); font-size: var(--fs-xs); min-height: 22px; }
    .preview-name:empty, .preview-qty:empty { display: none; }
    .pq { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: var(--r-pill); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
    .pq.a { background: var(--a-wash); color: var(--a); }
    .pq.b { background: var(--b-wash); color: var(--b); }
    .pq i { font-style: normal; font-family: var(--font-ui); }

    /* --- compare another ----------------------------------------------------------- */
    .another-pop {
      position: absolute; right: 0; top: calc(100% + var(--unit)); z-index: 60; width: 300px;
      display: flex; flex-direction: column; gap: var(--unit);
      padding: calc(var(--unit) * 1.5);
      background: var(--elev); border: 1px solid var(--line);
      border-radius: var(--r-md); box-shadow: var(--lift-3);
    }
    .another-pop[hidden] { display: none; }
    /* What the pick replaces (deck 2; deck 1 stays), then the deck tabs already open, one
       click each, as in the popup and the in-page panel. */
    .pop-label {
      font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.35;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    }
    .pop-tabs { display: flex; flex-direction: column; gap: 6px; max-height: 172px; overflow-y: auto; scrollbar-width: thin; }
    .pop-tabs[hidden] { display: none; }
    .pop-tab {
      display: flex; align-items: center; gap: var(--unit); flex: none;
      width: 100%; text-align: left; cursor: pointer;
      padding: calc(var(--unit) * 1.1) calc(var(--unit) * 1.25);
      font-family: var(--font-ui); font-size: var(--fs-xs); color: var(--ink);
      background: var(--elev); border: 1px solid var(--line); border-radius: var(--r-sm);
      transition: border-color .12s, box-shadow .12s;
    }
    .pop-tab:hover:not(:disabled) { border-color: var(--b); box-shadow: var(--lift-1); }
    .pop-tab:disabled { opacity: .45; cursor: default; }
    .pop-tab:focus-visible { outline-offset: -2px; }   /* the scrolling list clips a ring drawn outside */
    .pop-tab .src {
      flex: none; font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em;
      padding: 2px 8px; border-radius: var(--r-pill); background: var(--bg-deep); color: var(--ink-2);
    }
    .pop-tab .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    select.mat-field[hidden] { display: none; }
    .tb-msg { font-size: var(--fs-xs); color: var(--ink-3); }
    .tb-msg:empty { display: none; }
    .tb-msg.err { color: var(--brand); }

    /* --- list view ----------------------------------------------------------------- */
    body.view-list .card-grid { display: block; }
    body.view-list .card-slot {
      aspect-ratio: auto; height: 34px; border-radius: var(--r-xs); box-shadow: none;
      display: flex; align-items: center; gap: var(--unit); padding: 0 var(--unit);
      background: transparent; border-bottom: 1px solid var(--line);
    }
    body.view-list .card-slot:hover { transform: none; box-shadow: none; background: var(--elev); }
    body.view-list .card-slot img, body.view-list .card-slot .qty-badge { display: none; }
    body.view-list .card-slot.is-loading { background: transparent; }
    body.view-list .card-slot .proxy-name {
      display: flex; position: static; inset: auto; border: 0; padding: 0;
      justify-content: flex-start; text-align: left; flex: 1;
      font-size: var(--fs-sm); color: var(--ink);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    body.view-list .card-slot.is-proxy { background: transparent; }
    body.view-list .card-slot::before {
      content: attr(data-qty) "×";
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3);
      min-width: 26px; flex: none;
    }
    body.view-list .card-slot .board-tag { position: static; background: none; padding: 0; order: 3; color: var(--ink-3); }

    #loading { padding: calc(var(--unit) * 10) 0; text-align: center; font-size: var(--fs-md); color: var(--ink-3); }
    .footnote {
      max-width: 1280px; margin: 0 auto;
      padding: calc(var(--unit) * 3) var(--gutter) calc(var(--unit) * 6);
      display: flex; align-items: center; gap: var(--unit);
      font-size: var(--fs-xs); color: var(--ink-3);
    }
    .footnote a { color: var(--ink-3); }

    /* Four legend entries do not fit a narrow window on one line: they wrap. */
    @media (max-width: 1000px) {
      .seam-legend { flex-wrap: wrap; row-gap: var(--unit); }
      .lg { max-width: 100%; }
    }
    @media (max-width: 1080px) {
      .table-grid { grid-template-columns: minmax(0,1fr); }
      /* No room for the rail: the held card floats in the viewport's corner while one is held
         (it used to land under both grids, thousands of pixels from the card it showed), and
         lets the pointer through to the cards beneath. */
      .rail { position: fixed; right: 16px; bottom: 16px; top: auto; width: min(240px, 60vw); z-index: 50; pointer-events: none; }
      /* On the other side from the card it shows, so it never covers the card in focus. */
      .rail.left { left: 16px; right: auto; }
      .rail.top { top: 16px; bottom: auto; }
      .held { box-shadow: var(--lift-3); }
      /* Hidden while nothing is held; a card without an image still floats, to say so. */
      .held:has(.preview-name:empty) { display: none; }
      /* One line per deck: long names wrapped the pills to three lines and the sheet to half
         the screen. */
      .pq { max-width: 100%; }
      .pq i { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    @media (max-width: 760px) {
      .matchup { grid-template-columns: 1fr; gap: calc(var(--unit) * 2.5); text-align: center; padding-top: calc(var(--unit) * 4); }
      .side.b { text-align: center; }
      .side.b .deck-name { padding-right: 0; margin-right: 0; }
      .side.a .deck-edge, .side.b .deck-edge { margin-left: auto; margin-right: auto; }
      .counter { order: -1; }
      .sides { grid-template-columns: minmax(0,1fr); }
      .seam-legend { flex-direction: column; gap: var(--unit); }
      /* The coffee pill keeps its cup and lets the two actions share the top row. */
      .bmc #bmc-text-compare { display: none; }
    }
  </style>
</head>
<body>
<!--
  DIRECTION CONTRACT — Deck Compare, results
  THESIS: A one-page brief on two decks, read on paper in daylight; it refuses the dark
    dashboard the category ships and the gold-lit table this product used to be.
  OWN-WORLD: Cream paper, warm near-black ink, white sheets with a hairline, pill controls,
    the logo's teal for the action, red for the alarm alone. Side A burnt orange, side B teal, shared green are roles,
    never accents. The serif is set large only for the figures that decide.
  STORY: The reader sees how far apart the decks are before reading a word, walks each
    side's cards, then changes a deck without leaving the page.
  FIRST VIEWPORT: The two deck names left and right in their own ink, the similarity
    figure in serif between them, the overlap bar beneath, drawing in once left to right
    as the result lands; Compare another at the top edge.
  FORM: The Memo — brief-pinned by the maintainer (memos.sourceventures.vc); no roll.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div class="mat-edge">
    <span class="wordmark">
      <img src="icons/icon48.png" alt="">
      <span>Deck<b>Compare</b></span>
    </span>
    <div class="spacer"></div>
    <a href="https://buymeacoffee.com/mcouzinet" target="_blank" rel="noopener" class="bmc" id="bmc-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M7 3v2M10.5 3v2M14 3v2"/></svg>
      <span id="bmc-text-compare"></span>
    </a>
    <div class="edge-actions">
      <button class="mat-btn" id="swap-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16H3m0 0 3-3m-3 3 3 3"/><path d="M17 8h4m0 0-3-3m3 3-3 3"/></svg>
        <span id="swap-text"></span>
      </button>
      <div class="tb-wrap">
        <button class="mat-btn mat-btn--go" id="another-btn" aria-expanded="false" aria-controls="another-pop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span id="another-text"></span>
        </button>
        <div class="another-pop" id="another-pop" hidden>
          <div class="pop-label" id="another-label"></div>
          <div class="pop-tabs" id="another-tabs" hidden></div>
          <select class="mat-field" id="another-saved" hidden></select>
          <input class="mat-field" id="another-url" type="text">
          <button class="mat-btn mat-btn--go" id="another-go"></button>
          <div class="tb-msg" id="another-msg" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="mat">
    <div id="loading"></div>
    <div id="content" style="display:none">
      <h1 class="sr-only" id="results-heading"></h1>

      <section class="matchup">
        <div class="side a">
          <a class="deck-name" id="deck-a-name" target="_blank" rel="noopener">—</a>
          <div class="deck-edge"></div>
          <div class="deck-src" id="deck-a-src">—</div>
        </div>
        <div class="counter">
          <div class="counter-well">
            <div class="counter-num" id="ring-num"></div>
          </div>
          <div class="counter-label" id="ring-label"></div>
          <div class="counter-basis" id="ring-basis"></div>
        </div>
        <div class="side b">
          <a class="deck-name" id="deck-b-name" target="_blank" rel="noopener">—</a>
          <div class="deck-edge"></div>
          <div class="deck-src" id="deck-b-src">—</div>
        </div>
      </section>

      <section class="seam">
        <div class="seam-bar" id="ring">
          <div class="seam-seg a" style="flex-basis:0%"></div>
          <div class="seam-seg ax" style="flex-basis:0%"></div>
          <div class="seam-seg s" style="flex-basis:0%"></div>
          <div class="seam-seg bx" style="flex-basis:0%"></div>
          <div class="seam-seg b" style="flex-basis:0%"></div>
        </div>
        <div class="seam-legend">
          <a class="lg a" href="#zone-a"><span class="sw"></span><span class="lg-label" id="lg-a-label"></span><span>·</span><span id="lg-a">0</span></a>
          <a class="lg s" href="#zone-s"><span class="sw"></span><span class="lg-label" id="lg-s-label"></span><span>·</span><span id="lg-s">0</span></a>
          <a class="lg x hide" href="#zone-s" id="lg-x-link"><span class="sw" id="lg-x-sw"></span><span class="lg-label" id="lg-x-label"></span><span>·</span><span id="lg-x">0</span></a>
          <a class="lg b" href="#zone-b"><span class="sw"></span><span class="lg-label" id="lg-b-label"></span><span>·</span><span id="lg-b">0</span></a>
        </div>
      </section>

      <div class="controls">
        <div class="segments" role="group">
          <button class="segment" data-board-filter="all" id="filter-all" aria-pressed="true"></button>
          <button class="segment" data-board-filter="commanders" id="filter-commanders" aria-pressed="false"></button>
          <button class="segment" data-board-filter="mainboard" id="filter-mainboard" aria-pressed="false"></button>
          <button class="segment" data-board-filter="sideboard" id="filter-sideboard" aria-pressed="false"></button>
        </div>
        <div class="spacer"></div>
        <div class="segments" role="group">
          <button class="segment" data-view="compact" id="view-compact" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/><rect x="19" y="3" width="2" height="6" rx="1"/><rect x="19" y="11" width="2" height="6" rx="1"/></svg>
          </button>
          <button class="segment" data-view="grid" id="view-grid" aria-pressed="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
          </button>
          <button class="segment" data-view="list" id="view-list" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
      </div>

      <div class="table-grid">
        <div>
          <h2 class="sr-only" id="exclusive-heading"></h2>
          <div class="sides">
            <div class="zone side-a" id="zone-a">
              <div class="zone-mark">
                <span class="zone-name" id="col-a-title"></span>
                <button class="zone-copy" data-copy-zone="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span class="zone-count" id="col-a-count">0</span><span class="zc-done"></span></button>
              </div>
              <div id="col-a-body"></div>
              <div class="col-empty hide" id="col-a-empty"></div>
            </div>
            <div class="zone side-b" id="zone-b">
              <div class="zone-mark">
                <span class="zone-name" id="col-b-title"></span>
                <button class="zone-copy" data-copy-zone="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span class="zone-count" id="col-b-count">0</span><span class="zc-done"></span></button>
              </div>
              <div id="col-b-body"></div>
              <div class="col-empty hide" id="col-b-empty"></div>
            </div>
          </div>

          <section class="shared zone" id="zone-s">
            <div class="zone-mark">
              <h2 class="zone-name" id="shared-title"></h2>
              <button type="button" class="shared-note" aria-pressed="false"><span class="warn-dot"></span><span id="qty-diff-note"></span><span class="note-off" aria-hidden="true">· <span id="qty-diff-off"></span></span></button>
              <button class="zone-copy" data-copy-zone="s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span class="zone-count" id="shared-count">0</span><span class="zc-done"></span></button>
            </div>
            <div class="srow-head" id="srow-head">
              <span class="ca" id="srow-head-a"></span>
              <span id="srow-head-card"></span>
              <span class="cc">&Delta;</span>
              <span class="cb" id="srow-head-b"></span>
            </div>
            <div id="shared-body"></div>
            <div class="col-empty hide" id="shared-empty"></div>
            <div class="sr-only" role="status" id="copy-status"></div>
          </section>
        </div>

        <aside class="rail">
          <div class="held">
            <div class="preview-stage" id="preview-stage">
              <img id="preview-img" alt="">
              <div class="preview-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <span id="hover-hint"></span>
              </div>
            </div>
            <div class="preview-name" id="preview-name"></div>
            <div class="preview-qty" id="preview-qty"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div class="footnote">
    <span id="footnote"></span>
    <span>·</span>
    <a id="rate-link" target="_blank" rel="noopener"></a>
  </div>

  <script src="shared.js"></script>
  <script src="compare.js"></script>
</body>
</html>
