<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Compare</title>
  <meta name="color-scheme" content="light">
  <!-- Critical: theme.css is external, so the popup would paint white for one
       frame before it lands. One ground colour, kept in step with --bg. -->
  <style>html{background-color:#f8f5f2}</style>
  <!-- The card images' host: its connection is open before the first card asks. -->
  <link rel="preconnect" href="https://cards.scryfall.io">
  <!-- The fonts that paint first: the interface and the wordmark. -->
  <link rel="preload" href="fonts/Archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/GeistMono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Beleren sets the figures and names that land first; requested from the stylesheet, it
       arrived after them and they drew in the fallback serif for a frame. -->
  <link rel="preload" href="fonts/Beleren2016-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      /* Palette, type ramp, reset and browser surfaces come from theme.css. Only what
         this page alone owns stays here: the five mana colours as printed pips. */
      --W:#f9faf4; --U:#0e68ab; --K:#150b00; --R:#d3202a; --G:#00733e;
      --brand-hi:var(--brand-btn-hi);
    }
    body { font-size:var(--fs-md); min-height:100vh; }

    .topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:16px;
      padding:14px var(--gutter); background:var(--bg); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { width:28px; height:28px; border-radius:var(--r-xs); }
    .brand-name { font-family:var(--font-mark); font-weight:700; font-size:var(--fs-md); letter-spacing:-0.01em; color:var(--a); }
    .brand-name b { color:var(--b); font-weight:800; }
    .topbar-spacer { flex:1; }
    .topbar-meta { font-size:var(--fs-micro); font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); }

    .shell { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:32px; max-width:1280px; margin:0 auto; padding:28px var(--gutter) 40px; align-items:start; }
    /* Below 1000px (two windows side by side: the deck site and this page) the rail keeps only the
       deck list, compact, above the content: adding decks, my list and pinning stay in reach; the
       held card, the curve and the sideboard go. */
    @media (max-width:1000px){
      .shell{ grid-template-columns:minmax(0,1fr); }
      /* .shell > .rail: the base .rail rule comes later in this sheet and, as specific, won; the
         list then stuck over the content, a third of a split window. */
      .shell > .rail{ position:static; order:-1; max-height:none; overflow:visible; padding:0; margin:0; }
      .rail > :not(#deck-panel):not(.preview-card){ display:none !important; }
      /* No rail for the held card: it floats in the window's corner away from the row it shows,
         only while a card is held, and lets the pointer through (as on the results page). */
      .rail > .preview-card{ position:fixed; right:16px; bottom:16px; width:min(240px, 60vw); z-index:50; pointer-events:none; box-shadow:var(--lift-3); }
      .rail > .preview-card.left{ left:16px; right:auto; }
      .rail > .preview-card.top{ top:16px; bottom:auto; }
      .rail > .preview-card:not(:has(.preview-stage.has)){ display:none; }   /* .rail > : the base rules come later */
      .rail .dp-list{ max-height:176px; }
    }
    #deck-panel:empty { display:none; }

    .panel { padding:24px 0; border-bottom:1px solid var(--line); margin-bottom:24px; }
    h1 { font-family:var(--font-display); font-weight:400; font-size:clamp(22px,2.8vw,34px); color:var(--ink); letter-spacing:-0.01em; line-height:1.1; }
    .sub { color:var(--ink-2); font-size:var(--fs-sm); margin-top:10px; max-width:62ch; }

    label.fld { display:block; font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; font-weight:600; color:var(--ink-3); margin:18px 0 8px; }
    textarea { width:100%; background:var(--elev); border:1px solid var(--line-strong); border-radius:var(--r-sm);
      padding:12px 14px; color:var(--ink); font-family:var(--font-mono); font-size:var(--fs-sm); resize:vertical; transition:border-color .12s, box-shadow .12s; }
    textarea::placeholder { color:var(--ink-3); }
    textarea:focus { outline:none; border-color:var(--b); box-shadow:inset 0 0 0 1px var(--b); }
    .or { display:flex; align-items:center; gap:12px; margin:16px 0; color:var(--ink-3); font-size:var(--fs-xs); }
    .or::before,.or::after { content:""; flex:1; height:1px; background:var(--line); }
    .run-row { display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
    .count { font-size:var(--fs-xs); color:var(--ink-3); }
    .err { color:var(--brand); font-size:var(--fs-sm); margin-top:10px; }
    #input-panel { position:relative; }
    .fields-close { position:absolute; top:16px; right:0; z-index:2; border:0; background:var(--elev); color:var(--ink-3);
      width:30px; height:30px; border-radius:50%; cursor:pointer; line-height:1; transition:all 0.14s; box-shadow:var(--lift-1); }
    .fields-close:hover { color:var(--brand); background:var(--brand-wash); }

    /* "+ Ajouter des decks" opens the fields as a popin above the analysis, not inline in the
       page flow — with a pool already on screen the inline version could expand out of view. */
    .modal-backdrop { position:fixed; inset:0; z-index:90; background:rgba(36,28,24,.45); }
    .modal-backdrop.hide { display:none; }
    body.modal-locked { overflow:hidden; }
    #input-panel.modal-open { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:91;
      width:min(640px, calc(100vw - 40px)); max-height:calc(100vh - 80px); overflow-y:auto;
      background:var(--elev); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--lift-3);
      padding:24px; margin:0; }

    /* open-tab picker — one click drops a deck you already have open into the links box */
    .tabpick { margin-bottom:16px; }
    .tabpick-label { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; font-weight:600; color:var(--ink-3); margin:0 0 8px; }
    /* Cap at ~4 rows so a window full of deck tabs scrolls instead of pushing the field down. */
    .tabpick-list { display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; scrollbar-width:thin; }
    .tabpick-list > * { flex:none; }
    .tabpick-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
      padding:10px 12px; font-family:var(--font-ui); font-size:var(--fs-xs); color:var(--ink);
      background:var(--elev); border:1px solid var(--line); border-radius:var(--r-sm); transition:all 0.14s; }
    .tabpick-item:hover:not(:disabled) { border-color:var(--b); box-shadow:var(--lift-1); transform:translateY(-1px); }
    .tabpick-item:disabled { opacity:.45; cursor:default; }
    .tabpick-item .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .src-chip { flex:none; font-size:var(--fs-micro); font-weight:600; letter-spacing:0.06em; padding:2px 8px;
      border-radius:var(--r-pill); white-space:nowrap; background:var(--bg-deep); color:var(--ink-2); }

    /* hero — the commander, its count, its colours */
    .hero { display:flex; gap:24px; align-items:flex-start; }
    .hero-art { width:150px; aspect-ratio:488/680; border-radius:var(--r-sm); flex-shrink:0; overflow:hidden; background:var(--bg-deep); box-shadow:var(--lift-2); }
    .hero-art img { width:100%; height:100%; object-fit:cover; display:none; border-radius:4.7% / 3.4%; }
    .hero-art.has img { display:block; }
    .hero-role { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.14em; font-weight:600; color:var(--a); margin-top:8px; }
    .hero h2 { font-family:var(--font-display); font-weight:400; font-size:clamp(22px,2.8vw,36px); color:var(--ink); letter-spacing:-0.01em; line-height:1.1; }
    .cpips { display:inline-flex; gap:5px; margin-top:10px; }
    .cpip { width:16px; height:16px; border-radius:50%; border:1px solid var(--line-strong); }
    .cpip.W{background:var(--W);} .cpip.U{background:var(--U);} .cpip.B{background:var(--K);} .cpip.R{background:var(--R);} .cpip.G{background:var(--G);} .cpip.C{background:var(--bg-deep);}
    .stats { display:flex; gap:16px 28px; margin-top:20px; flex-wrap:wrap; }
    .stat .n { display:block; font-family:var(--font-display); font-weight:400; font-size:30px; letter-spacing:-0.01em; color:var(--ink); line-height:1; font-variant-numeric:tabular-nums; }
    .stat .n.accent { color:var(--match); }
    .stat .n .of { font-size:var(--fs-md); font-weight:400; color:var(--ink-3); letter-spacing:0; }
    .stat .l { display:block; font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.1em; font-weight:600; color:var(--ink-3); margin-top:6px; }
    /* the two card stats are copy buttons (spans inside, hence the display:block above): same look,
       a pointer and an underlined label on hover; "copied!" takes the action ink, not a role colour.
       No border-radius here: the focus ring keeps the theme's own radius. */
    .stat-btn { background:none; border:0; text-align:left; font:inherit; color:inherit; cursor:pointer; }
    .stat-btn:hover .l, .stat-btn:focus-visible .l { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    .stat-btn.copied .l { color:var(--brand-btn); text-decoration:none; }

    /* card filters — keep / drop the decks that play a card, as chips above the results */
    .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:-6px 0 18px; }
    .filters .lbl { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; font-weight:600; color:var(--ink-3); margin-right:4px; }
    .chip { display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-xs); padding:4px 5px 4px 11px; border-radius:var(--r-pill);
      background:var(--elev); border:1px solid var(--line-strong); color:var(--ink); max-width:320px; }
    .chip .mode { font-weight:600; }
    .chip.with .mode { color:var(--match); }
    .chip.without .mode { color:var(--brand); }
    .chip-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:default; }
    .chip .hsh { color:var(--ink-3); white-space:nowrap; }
    .chip-x { border:0; background:none; color:var(--ink-3); cursor:pointer; font-size:var(--fs-md); line-height:1; padding:0 6px; border-radius:50%; }
    .chip-x:hover { color:var(--brand); background:var(--brand-wash); }

    /* The reference: one decklist the lists are read against, a deck of the pool pinned from
       the rail or "my list", kept outside the pool. A sheet under the hero: its name, then the
       figures that decide in the serif, in its side's ink (orange) and the alarm for the gaps. */
    .ref { background:var(--elev); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--lift-1); padding:16px 18px 14px; margin:-8px 0 24px; }
    .ref-head { display:flex; align-items:baseline; gap:10px; min-width:0; }
    .ref-kind { flex:none; font-size:var(--fs-micro); font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--a); }
    .ref.previewing .ref-kind { color:var(--ink-3); }
    .ref-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--font-display); font-size:var(--fs-lg); color:var(--ink); line-height:1.25; }
    .ref-head .src-chip { align-self:center; }
    .ref-warn { align-self:center; flex:none; font-size:var(--fs-micro); font-weight:600; padding:2px 8px; border-radius:var(--r-pill);
      background:var(--brand-wash); color:var(--brand); white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
    /* unpinning removes nothing: a quiet text action, not the alarm's × */
    .ref-x { margin-left:auto; align-self:center; flex:none; }
    .ref-reload { margin-left:auto; align-self:center; flex:none; }
    .ref-reload + .ref-x { margin-left:14px; }
    /* A phone's width cannot hold the label, the name, the source and both actions on one line:
       they wrap instead of scrolling the page sideways. */
    @media (max-width:480px){ .ref-head { flex-wrap:wrap; row-gap:4px; } }
    /* align-items:start: a stretched <button> would centre its figure lower than its neighbours' */
    /* 96px and a 16px gap: the five figures hold one row from 1024px (they wrapped 4 + 1). */
    .ref-figs { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); align-items:start; gap:14px 16px; margin-top:14px; }
    .rf .n { display:block; font-family:var(--font-display); font-weight:400; font-size:30px; line-height:1; letter-spacing:-0.01em; color:var(--ink); font-variant-numeric:tabular-nums; }
    .rf .n small { font-size:var(--fs-md); color:var(--ink-3); letter-spacing:0; }
    .rf.a .n { color:var(--a); }
    .rf .ctx { display:block; margin-top:4px; font-size:var(--fs-micro); color:var(--ink-3); }
    .rf.alarm .n { color:var(--brand); }
    .rf .l { display:block; margin-top:6px; font-size:var(--fs-micro); font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); line-height:1.35; }
    /* the gaps and the rare cards: counts you can press, like the hero's copy stats */
    .rf-btn { background:none; border:0; padding:0; text-align:left; font:inherit; color:inherit; cursor:pointer; }
    .rf-btn:hover .l, .rf-btn:focus-visible .l { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    /* "missing" says nothing more under a title that already says it, but for a previewed deck */
    body:not(.ref-preview) #gaps-missing .rtag { display:none; }
    #mine-saved { width:100%; }
    label.fld[hidden], #mine-saved[hidden] { display:none; }   /* display:block would beat the UA's [hidden] rule */
    .ref-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
    .ref-actions .pill { padding:5px 12px; }
    .lnk.ref-detail { color:var(--b); }   /* .lnk alone is Ink Mute: these are the next steps, in the action's teal */
    .lnk.ref-detail:hover { color:var(--brand-btn-hi); }
    .ref-legend { margin-left:auto; font-size:var(--fs-micro); color:var(--ink-3); }
    .ref-legend i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--a); margin-right:5px; vertical-align:1px; }

    /* "Compare my list": the dashed add affordance, at the end of the view controls */
    .mine-add { margin-left:auto; display:inline-flex; align-items:center; gap:6px; max-width:320px; padding:7px 14px 7px 11px;
      border:1px dashed var(--line-strong); background:transparent; color:var(--ink-2); border-radius:var(--r-pill); cursor:pointer;
      font-family:var(--font-ui); font-weight:600; font-size:var(--fs-xs); transition:color .14s, border-color .14s, background .14s; }
    .mine-add span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mine-add svg { width:14px; height:14px; flex:none; }
    .mine-add:hover { border-color:var(--b); color:var(--b); background:var(--elev); }

    /* The reference, marked in the lists: a dot where it plays the card, its own count when it
       differs from the pool's, "missing" on a consensus card it lacks; the rest steps back. */
    body.has-ref .prow .nm::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:8px; vertical-align:2px; background:transparent; }
    body.has-ref .prow.ref-has .nm::before { background:var(--a); }
    .prow .rq { font-family:var(--font-mono); font-size:var(--fs-micro); font-weight:600; color:var(--a); margin-left:6px; }
    .prow .rq:empty { display:none; }
    #or-saved[hidden] { display:none; }
    .rtag { flex:none; font-size:var(--fs-micro); font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:var(--r-pill); background:var(--brand-wash); color:var(--brand); }
    .rtag:empty { display:none; }
    .prow.ref-off .nm, .prow.ref-off .pct, .prow.ref-off .frac { color:var(--ink-3); }
    /* stepped back, still legible: Ink Mute needs a white ground (5.0:1), the well gives 4.1 */
    .prow.ref-off + .pbadges .pbadge:not(.ref-badge) { color:var(--ink-3); background:var(--elev); box-shadow:inset 0 0 0 1px var(--line); }
    .prow .nm, .prow .pct, .prow .frac { transition:color .12s; }
    /* With a reference on, the lists are read for its marks: a row's own tools wait for the pointer
       or the focus (opacity, so nothing moves), and stay put where there is no hover. */
    @media (hover: hover) {
      body.has-ref .prow .cp, body.has-ref .prow .fa { opacity:0; transition:opacity .12s; }
      body.has-ref .prow:hover .cp, body.has-ref .prow:focus-within .cp,
      body.has-ref .prow:hover .fa:not(:disabled), body.has-ref .prow:focus-within .fa:not(:disabled) { opacity:1; }
      body.has-ref .prow:hover .fa:disabled, body.has-ref .prow:focus-within .fa:disabled { opacity:.3; }
    }

    /* decks-in-pool panel (right rail): a white sheet with a pinned head */
    .deckpanel { background:var(--elev); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--lift-1);
      display:flex; flex-direction:column; flex:none; }
    .dp-head { flex:none; display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line);
      font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-3); font-weight:600; }
    /* The list is capped at ~7 rows and scrolls on its own; the head stays pinned, so a
       100-deck pool never pushes the held card out of the rail. */
    .dp-list { max-height:264px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
    .dp-c { font-family:var(--font-mono); background:var(--bg-deep); color:var(--ink-2); padding:1px 9px; border-radius:var(--r-pill); font-size:var(--fs-micro); letter-spacing:0; }
    /* "+ Add", the dashed add affordance, pinned at the right of the head with the list it feeds */
    .dp-add { margin-left:auto; display:inline-flex; align-items:center; gap:4px; padding:3px 10px 3px 7px; border:1px dashed var(--line-strong);
      background:transparent; color:var(--ink-2); border-radius:var(--r-pill); cursor:pointer; font-family:var(--font-ui); font-weight:600;
      font-size:var(--fs-xs); letter-spacing:0; text-transform:none; line-height:1.2; transition:color .14s, border-color .14s, background .14s; }
    .dp-add svg { width:12px; height:12px; flex:none; }
    .dp-add:hover { border-color:var(--b); color:var(--b); background:var(--bg); }
    .dp-item { display:flex; align-items:center; gap:6px; padding:8px 10px 8px 14px; border-bottom:1px solid var(--line); }
    .dp-item:last-child { border-bottom:0; }
    .dp-item:hover { background:var(--bg); }
    /* A row is a button: hovering it previews that deck in the lists, a click pins it as the
       reference. The deck's page opens from the arrow beside it. */
    .dp-link { flex:1; min-width:0; text-decoration:none; color:var(--ink); display:flex; align-items:baseline; gap:7px;
      border:0; background:none; padding:0; font:inherit; text-align:left; cursor:pointer; }
    .dp-link:hover .dp-n { color:var(--b); }
    .dp-item.pinned, .dp-item.pinned:hover { background:var(--a-wash); }
    .dp-item.pinned .dp-hash { color:var(--a); font-weight:700; }
    .dp-fig { display:none; margin-left:auto; flex-shrink:0; font-family:var(--font-mono); font-size:var(--fs-micro); font-weight:600; color:var(--a); font-variant-numeric:tabular-nums; }
    .dp-item:hover .dp-fig, .dp-item:focus-within .dp-fig, .dp-item.pinned .dp-fig, .dp-mine .dp-fig { display:inline; }
    .dp-item:hover .dp-fig ~ .dp-src, .dp-item:focus-within .dp-fig ~ .dp-src, .dp-item.pinned .dp-fig ~ .dp-src { display:none; }
    .dp-open { flex-shrink:0; display:inline-flex; color:var(--ink-3); padding:2px; border-radius:var(--r-xs); opacity:0; }
    .dp-open svg { width:13px; height:13px; }
    .dp-item:hover .dp-open, .dp-open:focus-visible { opacity:1; }
    .dp-open:hover { color:var(--b); }
    /* my list: above the pool's rows and outside their scroll, labelled, never numbered */
    .dp-mine { flex:none; border-bottom:1px solid var(--line); }
    .dp-hint { flex:none; padding:9px 14px; border-top:1px solid var(--line); font-size:var(--fs-micro); color:var(--ink-3); line-height:1.45; }
    /* orange belongs to the reference: my list's row takes it only while it is the one pinned */
    .dp-mine .dp-hash { font-family:var(--font-ui); font-size:var(--fs-micro); font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
    .dp-mine:not(.pinned) .dp-fig { color:var(--ink-3); }
    .dp-mine.pinned .dp-hash { color:var(--a); }
    .dp-n { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-sm); }
    .dp-hash { color:var(--ink-3); font-family:var(--font-mono); font-size:var(--fs-micro); flex-shrink:0; }
    .dp-src { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-3); margin-left:auto; flex-shrink:0; }
    .dp-x { border:0; background:none; color:var(--ink-3); cursor:pointer; font-size:var(--fs-lg); line-height:1; padding:0 6px; border-radius:50%; flex-shrink:0; }
    .dp-x:hover { color:var(--brand); background:var(--brand-wash); }
    /* set aside by a card filter: still in the pool, not on the table */
    .dp-item.off .dp-n { color:var(--ink-3); text-decoration:line-through; }
    .dp-item.off .dp-hash, .dp-item.off .dp-src { color:var(--ink-3); }   /* no opacity: 2.4:1 failed AA; the strike-through says it */
    .dp-errs { flex:none; padding:10px 14px; border-top:1px solid var(--line); font-size:var(--fs-micro); color:var(--ink-2); background:var(--brand-wash); line-height:1.5; }
    .dp-errs b { display:block; color:var(--brand); margin-bottom:3px; font-weight:600; }
    .dp-err { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* controls */
    .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
    .segmented { display:inline-flex; background:var(--elev); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px; gap:2px; }
    .seg-btn { border:0; background:transparent; color:var(--ink-3); font-family:var(--font-ui); font-size:var(--fs-xs); font-weight:600;
      padding:7px 14px; border-radius:var(--r-pill); cursor:pointer; transition:all .12s; white-space:nowrap; }
    .seg-btn:hover { color:var(--ink); background:var(--bg-deep); }
    .seg-btn.active { background:var(--b); color:#fff; }
    .pills { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
    .pill { border:1px solid var(--line-strong); background:var(--elev); color:var(--ink-2); font-size:var(--fs-xs); font-weight:600; padding:6px 13px;
      border-radius:var(--r-pill); cursor:pointer; transition:all .14s; }
    .pill:hover { color:var(--b); border-color:var(--b); }
    .pill.active { background:var(--b); color:#fff; border-color:var(--b); }

    /* sections — white sheets */
    .sect { background:var(--elev); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; margin-bottom:20px; box-shadow:var(--lift-1); }
    .sect-head { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); }
    .sect-title { font-size:var(--fs-micro); font-weight:600; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink); }
    .sect-title .c { color:var(--ink-3); font-weight:600; }
    .sect-note { font-size:var(--fs-micro); color:var(--ink-3); text-transform:none; letter-spacing:0; font-weight:500; }
    .sect-actions { margin-left:auto; display:flex; gap:14px; }
    .lnk { background:none; border:0; color:var(--ink-3); font-size:var(--fs-xs); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-family:var(--font-ui); }
    .lnk:hover { color:var(--ink); }
    .lnk svg { width:13px; height:13px; }

    .prow { display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid var(--line); }
    .prow:last-child { border-bottom:0; }
    .prow:hover { background:var(--bg); }
    .prow input[type=checkbox] { accent-color:var(--b); cursor:pointer; flex-shrink:0; }
    .prow .nm { flex:1; min-width:0; font-size:var(--fs-sm); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:default; }
    .prow .xq { font-size:var(--fs-micro); color:var(--ink-3); margin-left:5px; }
    .prow .cp, .prow .fa { background:none; border:0; color:var(--ink-3); cursor:pointer; flex-shrink:0; display:inline-flex; padding:0; }
    .prow .cp:hover { color:var(--ink); }
    /* a copy done: a check mark in the action ink for a beat (pool.js copied) */
    .did-copy { color:var(--brand-btn) !important; opacity:1 !important; }
    .cp.did-copy svg { display:none; }
    .cp.did-copy::after { content:"\2713"; font-size:13px; line-height:14px; width:14px; text-align:center; }
    .lnk.did-copy::after { content:" \2713"; }
    .prow .cp svg, .prow .fa svg { width:14px; height:14px; }
    .prow .fa.keep:hover:not(:disabled) { color:var(--match); }
    .prow .fa.drop:hover:not(:disabled) { color:var(--brand); }
    .prow .fa:disabled { opacity:.3; cursor:default; }
    .prow .pct { font-family:var(--font-mono); font-size:var(--fs-sm); font-weight:600; color:var(--ink); width:46px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
    .prow .frac { font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--ink-3); width:42px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
    /* A phone: the row's tools, tag and figures left the name a letter ("É…"). The deck count
       goes (the percentage says it), and the name may take two lines. */
    @media (max-width:480px){
      .prow .frac { display:none; }
      .prow .nm { white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    }
    /* A row followed by its deck badges is one entry: the hairline moves under the badges. */
    .prow:has(+ .pbadges) { border-bottom:0; }
    .pbadges { display:flex; flex-wrap:wrap; gap:4px; padding:4px 16px 10px 40px; margin-top:-4px; border-bottom:1px solid var(--line); }
    /* A 100-deck pool is some 1,300 rows and 9,600 badges: the rows off screen are skipped until
       they come near it. Hovering down the deck list restyled every one of them (about 225 ms of
       style work); now about 10. content-visibility clips to the padding box, hence the badges'
       top padding (pulled back by the margin): room for a focused badge's ring. The sizes stand
       for the content box of a one-line row (36px with its padding), until the row has been
       drawn once and its own height is remembered. */
    .prow, .pbadges { content-visibility:auto; }
    .prow { contain-intrinsic-size:auto 20px; }
    .pbadges { contain-intrinsic-size:auto 21px; }
    .pbadges:last-child { border-bottom:0; }
    .pbadge { font-family:var(--font-mono); font-size:var(--fs-micro); padding:2px 6px; border-radius:var(--r-xs); background:var(--bg-deep); color:var(--ink-2); text-decoration:none; }
    a.pbadge:hover { background:var(--b); color:#fff; }
    .pbadge.ref-badge { background:var(--a-wash); color:var(--a); font-weight:600; }   /* the reference's own #n: its wash, not a fill */
    .bar { flex:1; height:6px; border-radius:3px; background:var(--bg-deep); overflow:hidden; max-width:120px; }
    .bar > i { display:block; height:100%; background:var(--a); border-radius:3px; }
    .type-divider { display:flex; align-items:center; gap:10px; padding:12px 16px 4px; }
    .type-divider span { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; font-weight:600; color:var(--ink-3); }
    .empty { padding:28px; text-align:center; color:var(--ink-3); }

    /* mana curve */
    .curve { background:var(--elev); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; box-shadow:var(--lift-1); }
    .curve h3 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-3); font-weight:600; margin-bottom:12px; }
    .bars { display:flex; align-items:flex-end; gap:6px; height:110px; }
    .bars .col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
    .bars .col .v { font-size:var(--fs-micro); color:var(--ink-3); font-family:var(--font-mono); }
    .bars .col .b { width:100%; background:var(--a); border-radius:3px 3px 0 0; min-height:2px; opacity:.85; }
    .bars .col .x { font-size:var(--fs-micro); color:var(--ink-3); font-family:var(--font-mono); }
    .curve .cap { font-size:var(--fs-micro); color:var(--ink-3); text-align:center; margin-top:10px; }

    /* right rail preview */
    /* The rail is capped to the viewport and scrolls as a whole when the deck list, the
       held card and the curve together outgrow it; nothing inside it gets squeezed away. */
    .rail { position:sticky; top:84px; display:flex; flex-direction:column; gap:16px; max-height:calc(100vh - 100px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; padding:4px; margin:-4px; }
    .rail > * { flex:none; }
    .preview-card { flex:none; background:var(--elev); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; box-shadow:var(--lift-2); }
    .preview-stage { aspect-ratio:488/680; border-radius:var(--r-sm); background:var(--bg-deep);
      display:grid; place-items:center; overflow:hidden; }
    .preview-stage img { width:100%; height:100%; object-fit:contain; display:none; filter:drop-shadow(0 10px 24px rgba(36,28,24,0.28)); border-radius:4.7% / 3.4%; }
    .preview-stage.has img { display:block; }
    .preview-hint { color:var(--ink-2); font-size:var(--fs-xs); text-align:center; padding:0 20px; }   /* Ink Mute on the well is 4.1:1 */
    .preview-stage.has .preview-hint { display:none; }
    .preview-name { font-family:var(--font-display); font-weight:400; font-size:17px; letter-spacing:0; color:var(--ink); margin-top:14px; min-height:22px; }
    /* Nothing held yet: the sheet rests and its stage folds to the hint, as on the results page,
       instead of a card-sized blank that pushed the mana curve out of the rail. */
    .preview-card:not(:has(.preview-stage.has)) { box-shadow:var(--lift-1); }
    .preview-stage:not(.has) { aspect-ratio:auto; padding:24px 0; }
    .preview-name:empty { display:none; }

    /* selection bar — a pill floating above the sheet */
    .selbar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:50; display:none;
      align-items:center; gap:16px; background:var(--elev); border:1px solid var(--line); border-radius:var(--r-pill);
      padding:9px 12px 9px 18px; box-shadow:var(--lift-3); }
    .selbar.show { display:flex; }
    .selbar .n { font-size:var(--fs-sm); color:var(--ink); }
    .footnote { max-width:1280px; margin:0 auto; padding:4px var(--gutter) 40px; font-size:var(--fs-xs); color:var(--ink-3); }
    #loading { text-align:center; padding:50px; color:var(--ink-3); }
    .hide { display:none !important; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
<!--
  DIRECTION CONTRACT — Deck Compare, pool
  THESIS: One pool of decks read as a brief: what every list agrees on, then the flex
    slots. It refuses the dashboard tile grid and the gold-lit table this product used to be.
  OWN-WORLD: Cream paper, warm near-black ink, a white sheet for every list, pill controls
    with the chosen one inked, the logo's teal for the action, red for what is excluded, green
    for what is shared. The serif carries the commander's name and the counts.
  STORY: The reader sees the commander, how much of the pool agrees with it, which cards
    are consensus and which are flex, and narrows the pool by card without losing a deck.
  FIRST VIEWPORT: The commander's art and name with its counts across the top, the usage
    sheet beneath, the held card and the pool's deck list on the right.
  FORM: The Memo — brief-pinned by the maintainer (memos.sourceventures.vc); no roll.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div class="topbar">
    <div class="brand"><img class="brand-mark" src="icons/icon48.png" alt=""><span class="brand-name">Deck<b>Compare</b></span></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-meta" id="topbar-meta"></div>
  </div>

  <div class="modal-backdrop hide" id="modal-backdrop"></div>

  <div class="shell">
    <main>
      <!-- input -->
      <section class="panel" id="input-panel">
        <button class="mat-btn mat-btn--flat mat-btn--icon fields-close hide" id="fields-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div id="intro">
          <h1 id="intro-title"></h1>
          <p class="sub" id="intro-sub"></p>
        </div>
        <div id="input-fields">
          <div class="tabpick hide" id="tabpick">
            <div class="tabpick-label" id="tabpick-label"></div>
            <div class="tabpick-list" id="tabpick-list"></div>
          </div>
          <label class="fld" id="mine-saved-label" for="mine-saved" hidden></label>
          <select class="mat-field" id="mine-saved" hidden></select>
          <div class="or" id="or-saved" hidden></div>
          <label class="fld" id="links-label"></label>
          <textarea id="urls" rows="5" spellcheck="false" placeholder="https://www.moxfield.com/decks/...&#10;https://archidekt.com/decks/...&#10;https://www.mtgtop8.com/event?e=...&d=..."></textarea>
          <div class="or" id="or-paste-text"></div>
          <textarea id="texts" rows="4" spellcheck="false" placeholder="Commander&#10;1 Krenko, Mob Boss&#10;&#10;Deck&#10;1 Lightning Bolt&#10;..."></textarea>
          <div class="run-row">
            <span class="count" id="count">0</span>
            <button class="mat-btn mat-btn--go" id="run" disabled></button>
          </div>
          <p class="err hide" id="err"></p>
        </div>
      </section>

      <div id="loading" class="hide"></div>

      <!-- results -->
      <div id="results" class="hide">
        <section class="panel hero" id="hero">
          <div class="hero-art" id="hero-art"><img id="hero-img" alt=""></div>
          <div style="flex:1; min-width:0">
            <h2 id="hero-name">—</h2>
            <div class="hero-role" id="hero-eyebrow"></div>
            <div class="cpips" id="hero-pips"></div>
            <div class="stats" id="hero-stats"></div>
            <div class="sr-only" id="hero-status" role="status" aria-live="polite"></div>
          </div>
        </section>

        <section class="ref hide" id="ref"></section>

        <div class="filters hide" id="filters"></div>

        <div class="controls">
          <div class="segmented" id="view-seg">
            <button class="seg-btn active" data-view="usage"><span id="view-usage-text"></span></button>
            <button class="seg-btn" data-view="average"><span id="view-average-text"></span></button>
          </div>
          <button type="button" class="mine-add hide" id="mine-add"></button>
        </div>

        <div id="usage-view">
          <div class="pills" id="cat-pills"></div>
          <div id="sections"></div>
        </div>

        <div id="average-view" class="hide"></div>
      </div>
    </main>

    <aside class="rail">
      <div class="deckpanel" id="deck-panel"></div>
      <div class="preview-card">
        <div class="preview-stage" id="pv-stage">
          <img id="pv-img" alt="">
          <div class="preview-hint" id="preview-hint"></div>
        </div>
        <div class="preview-name" id="pv-name"></div>
      </div>
      <div id="curve-slot"></div>
      <div id="side-slot"></div>
    </aside>
  </div>

  <div class="selbar" id="selbar">
    <span class="n" id="sel-n">0</span>
    <button class="lnk" id="sel-copy" style="color:var(--a)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M4 13V4.5A1.5 1.5 0 0 1 5.5 3H13"/></svg> <span id="sel-copy-text"></span></button>
    <button class="lnk" id="sel-clear"></button>
  </div>

  <div class="footnote" id="pool-footnote"></div>

  <script src="shared.js"></script>
  <script src="enrich.js"></script>
  <script src="pool-analyze.js"></script>
  <script src="pool.js"></script>
</body>
</html>
