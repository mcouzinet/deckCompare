<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deck Compare</title>
  <meta name="color-scheme" content="dark">
  <!-- Critical: theme.css is external, so the popup would paint white for one
       frame before it lands. One ground colour, kept in step with --felt. -->
  <style>html{background-color:#17120d}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* The popup is the near edge of the same mat: 400px of felt, your side at the top,
       the opponent's below, the seam between them. */
    body { width: 400px; }

    .p-head {
      display: flex; align-items: center; gap: calc(var(--unit) * 1.5);
      padding: calc(var(--unit) * 2) calc(var(--unit) * 2.5);
      border-bottom: 1px solid var(--rule);
    }
    .p-head .spacer { flex: 1; }
    .bmc {
      display: inline-flex; align-items: center; gap: calc(var(--unit) * 0.8);
      padding: calc(var(--unit) * 0.8) calc(var(--unit) * 1.2);
      font-size: var(--fs-micro); font-weight: 600; text-decoration: none; white-space: nowrap;
      color: var(--warn); border: 1px solid var(--stitch); border-radius: 4px;
      transition: color .12s, border-color .12s;
    }
    .bmc svg { width: 13px; height: 13px; }
    .bmc:hover { color: var(--warn-hi); border-color: var(--warn); }

    .p-body { padding: calc(var(--unit) * 2.5); display: flex; flex-direction: column; gap: calc(var(--unit) * 2); }

    /* --- your side ---------------------------------------------------------------- */
    .field-label {
      font-family: var(--font-display);
      font-size: var(--fs-micro); font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      margin-bottom: calc(var(--unit) * 1.2);
      display: flex; align-items: center; gap: calc(var(--unit) * 0.9);
    }
    .field-label .pip { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .field-label.a { color: var(--a); } .field-label.a .pip { background: var(--a); }
    .field-label.b { color: var(--b); } .field-label.b .pip { background: var(--b); }

    /* The detected deck is a card laid on the mat, lit from above. No accent stripe:
       the label above it already carries the side's ink. */
    .detected {
      display: flex; align-items: center; gap: calc(var(--unit) * 1.5);
      padding: calc(var(--unit) * 1.5);
      background: var(--felt-lit); border: 1px solid var(--stitch);
      border-radius: 5px; box-shadow: var(--lift-1);
    }
    .detected .ico {
      width: 32px; height: 32px; border-radius: 4px; flex: none;
      display: grid; place-items: center;
      background: var(--a-wash); color: var(--a);
    }
    .detected .ico svg { width: 17px; height: 17px; }
    .detected .meta { min-width: 0; flex: 1; }
    .detected .dname {
      font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg);
      color: var(--ink); line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detected .dsub { margin-top: 3px; display: flex; align-items: center; gap: var(--unit); }
    .detected .live {
      display: inline-flex; align-items: center; gap: 5px; flex: none;
      font-size: var(--fs-micro); font-weight: 600; color: var(--match);
    }
    .detected .live .blink { width: 6px; height: 6px; border-radius: 50%; background: var(--match); }
    .detected.none .ico { background: var(--raised); color: var(--ink-3); }
    .detected.none .dname { color: var(--ink-2); font-size: var(--fs-md); }
    .src-chip {
      font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em;
      padding: 2px 6px; border-radius: 3px; white-space: nowrap;
      background: var(--raised); color: var(--ink-2);
    }

    /* --- first run ---------------------------------------------------------------- */
    .onboarding { display: none; }
    .detected.none ~ .onboarding { display: block; margin-top: calc(var(--unit) * 1.5); }
    .onboarding-steps { list-style: none; }
    .onboarding-steps li {
      display: flex; align-items: baseline; gap: var(--unit);
      padding: calc(var(--unit) * 0.6) 0; font-size: var(--fs-xs); color: var(--ink-2);
    }
    .onboarding-steps .num {
      width: 17px; height: 17px; border-radius: 50%; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--raised); color: var(--ink); font-size: var(--fs-micro); font-weight: 700;
      font-family: var(--font-mono);
    }
    .onboarding-sites, .settings-sites .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: calc(var(--unit) * 1.5); }
    .chip {
      font-size: var(--fs-micro); font-weight: 600; white-space: nowrap;
      padding: 2px 7px; border-radius: 3px;
      background: var(--raised); color: var(--ink-2);
    }

    /* --- the seam ----------------------------------------------------------------- */
    .vsline { display: flex; align-items: center; gap: calc(var(--unit) * 1.5); }
    .vsline::before, .vsline::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
    .vsline span {
      font-family: var(--font-display); font-weight: 700; font-size: var(--fs-micro);
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3);
    }

    /* --- open deck tabs ------------------------------------------------------------ */
    .tabpick { margin-bottom: calc(var(--unit) * 1.5); }
    .tabpick-label {
      font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: var(--unit);
    }
    .tabpick-list { display: flex; flex-direction: column; gap: 5px; }
    .tabpick-item {
      display: flex; align-items: center; gap: calc(var(--unit) * 1.2);
      width: 100%; text-align: left; cursor: pointer;
      padding: calc(var(--unit) * 1.2);
      font-family: var(--font-ui); font-size: var(--fs-xs); color: var(--ink);
      background: var(--felt-lit); border: 1px solid var(--stitch); border-radius: 4px;
      box-shadow: var(--lift-1);
      transition: transform .12s cubic-bezier(.2,.8,.3,1), box-shadow .12s, background .12s;
    }
    .tabpick-item:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--lift-2); background: var(--raised); }
    .tabpick-item:disabled { opacity: .45; cursor: default; box-shadow: none; }
    .tabpick-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabpick-item .src-chip { flex: none; }

    /* --- the one field ------------------------------------------------------------- */
    .input-row { display: flex; gap: var(--unit); }
    .deck-search-wrap { position: relative; flex: 1; min-width: 0; }
    .deck-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
      max-height: 210px; overflow-y: auto;
      background: var(--felt-lit); border: 1px solid var(--stitch);
      border-radius: 5px; box-shadow: var(--lift-3);
    }
    .deck-dropdown.open { display: block; }
    .deck-option {
      display: flex; align-items: center; justify-content: space-between; gap: var(--unit);
      padding: calc(var(--unit) * 1.1) calc(var(--unit) * 1.5);
      font-size: var(--fs-xs); color: var(--ink-2); cursor: pointer;
    }
    .deck-option:hover, .deck-option.active { background: var(--raised); color: var(--ink); }
    .deck-option .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .deck-option .fmt { font-size: var(--fs-micro); color: var(--ink-3); font-weight: 600; flex: none; }
    .deck-dropdown-empty {
      padding: calc(var(--unit) * 1.1) calc(var(--unit) * 1.5);
      font-size: var(--fs-xs); color: var(--ink-3);
    }

    /* --- hints -------------------------------------------------------------------- */
    .hint { font-size: var(--fs-micro); color: var(--ink-3); }
    .hint b { color: var(--ink-2); font-weight: 600; }
    button.hint, button.hint-configure { font-family: inherit; text-align: left; width: 100%; cursor: pointer; }
    button.hint { border: 0; background: none; padding: 0; margin-top: var(--unit); }
    .hint-configure {
      display: flex; align-items: center; gap: var(--unit); margin-top: var(--unit);
      padding: calc(var(--unit) * 1.2);
      font-size: var(--fs-xs); font-weight: 600; color: var(--warn);
      background: transparent; border: 1px dashed var(--warn); border-radius: 4px;
    }
    .hint-configure svg { width: 15px; height: 15px; flex: none; }
    .hint-configure:hover { background: rgba(230,181,78,0.08); }

    /* --- pool, a second table ------------------------------------------------------ */
    .pool-entry {
      display: flex; align-items: center; justify-content: center; gap: var(--unit);
      width: 100%; cursor: pointer;
      padding: calc(var(--unit) * 1.3);
      font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: 600;
      color: var(--ink-2); background: transparent;
      border: 1px solid var(--rule); border-radius: 4px;
      transition: color .12s, border-color .12s, background .12s;
    }
    .pool-entry:hover { color: var(--ink); border-color: var(--stitch); background: var(--felt-lit); }
    .pool-entry svg { width: 14px; height: 14px; color: var(--a); }
    .pool-entry .sub { color: var(--ink-3); font-weight: 500; }

    /* --- settings ------------------------------------------------------------------ */
    .settings-panel { border-bottom: 1px solid var(--rule); }
    .settings-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(var(--unit) * 1.5) calc(var(--unit) * 2.5);
      font-family: var(--font-display);
      font-size: var(--fs-micro); font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
    }
    .settings-body { padding: 0 calc(var(--unit) * 2.5) calc(var(--unit) * 2); display: flex; flex-direction: column; gap: calc(var(--unit) * 1.5); }
    .settings-field { display: flex; flex-direction: column; gap: calc(var(--unit) * 0.7); }
    .settings-label { font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    .settings-hint { font-size: var(--fs-micro); color: var(--ink-3); }
    .settings-check { flex-direction: row; align-items: flex-start; gap: var(--unit); }
    .settings-check input { margin: 2px 0 0; flex: none; }
    .settings-check .settings-label { cursor: pointer; text-transform: none; letter-spacing: 0; font-size: var(--fs-xs); color: var(--ink-2); }
    .source-row { display: flex; gap: 5px; }
    .source-row .mat-btn { flex: 1; padding: calc(var(--unit) * 1.2) calc(var(--unit) * 0.6); font-size: var(--fs-xs); }

    #status {
      padding: 0 calc(var(--unit) * 2.5) calc(var(--unit) * 1.5);
      font-size: var(--fs-xs); color: var(--ink-3); min-height: 18px;
    }
    #status.error { color: var(--brand); }
  </style>
</head>
<body>
<!--
  DIRECTION CONTRACT — Deck Compare, popup
  THESIS: The near edge of the same table: your deck, the seam, the opponent's side —
    not a form with two fields.
  OWN-WORLD: Warm felt under one overhead light. Areas are silkscreened with a rule and
    a name, never boxed and never nested. Deck 1 orange and deck 2 teal are the two sides
    of the mat, not accents. One button component. No element carries its own halo.
  STORY: The reader sees which deck is theirs, picks the other from a tab they already
    have open, and is on the results page in one click.
  FIRST VIEWPORT: Your deck named on a lifted card at the top, VERSUS across the seam,
    the open deck tabs beneath it, then the one field and Compare.
  FORM: The Table — candidate 3 of 7 by resonance; seed 009366bf.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div class="p-head">
    <span class="wordmark">
      <img src="icons/icon48.png" alt="">
      <span>Deck<b>Compare</b></span>
    </span>
    <div class="spacer"></div>
    <a href="https://buymeacoffee.com/mcouzinet" target="_blank" rel="noopener" class="bmc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M7 3v2M10.5 3v2M14 3v2"/></svg>
      <span id="bmc-text"></span>
    </a>
    <button class="mat-btn mat-btn--flat mat-btn--icon" id="settings-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>

  <div class="settings-panel" id="settings-panel" style="display:none">
    <div class="settings-head">
      <span id="settings-title"></span>
      <button class="mat-btn mat-btn--flat mat-btn--icon" id="settings-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-field">
        <label class="settings-label" id="settings-user-label" for="settings-user"></label>
        <input class="mat-field" id="settings-user" type="text">
      </div>
      <div class="settings-field">
        <label class="settings-label" id="settings-loadfrom-label"></label>
        <div class="source-row">
          <button class="mat-btn" data-source="moxfield">Moxfield</button>
          <button class="mat-btn" data-source="archidekt">Archidekt</button>
          <button class="mat-btn" data-source="magicville">Magic-Ville</button>
        </div>
      </div>
      <div class="hint" id="settings-hint"></div>
      <div class="settings-field settings-check">
        <input type="checkbox" id="settings-inject">
        <div>
          <label class="settings-label" id="settings-inject-label" for="settings-inject"></label>
          <div class="settings-hint" id="settings-inject-hint"></div>
        </div>
      </div>
      <div class="settings-field settings-sites">
        <label class="settings-label" id="supports-lbl"></label>
        <div class="chips">
          <span class="chip">Moxfield</span>
          <span class="chip">Archidekt</span>
          <span class="chip">MTGGoldfish</span>
          <span class="chip">mtgtop8</span>
          <span class="chip">Magic-Ville</span>
          <span class="chip">mtgdecks</span>
          <span class="chip">Melee</span>
          <span class="chip">getpaird</span>
        </div>
        <div class="settings-hint" id="url-hint"></div>
      </div>
    </div>
  </div>

  <div class="p-body">
    <div>
      <div class="field-label a"><span class="pip"></span><span id="lbl-deck1"></span></div>
      <div class="detected none" id="detected">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
        </div>
        <div class="meta">
          <div class="dname" id="detected-name"></div>
          <div class="dsub" id="detected-sub"></div>
        </div>
        <span class="live" id="detected-live" style="display:none"><span class="blink"></span><span id="detected-badge"></span></span>
      </div>
      <div class="onboarding" id="onboarding">
        <div class="settings-label" id="onboarding-title"></div>
        <ol class="onboarding-steps">
          <li><span class="num">1</span><span id="onboarding-step1"></span></li>
          <li><span class="num">2</span><span id="onboarding-step2"></span></li>
          <li><span class="num">3</span><span id="onboarding-step3"></span></li>
        </ol>
        <div class="onboarding-sites">
          <span class="chip">Moxfield</span>
          <span class="chip">MTGGoldfish</span>
          <span class="chip">Archidekt</span>
          <span class="chip">mtgtop8</span>
          <span class="chip">Magic-Ville</span>
          <span class="chip">mtgdecks</span>
          <span class="chip">Melee</span>
          <span class="chip">getpaird</span>
        </div>
      </div>
    </div>

    <div class="vsline deck2-section"><span id="vs-text"></span></div>

    <div class="deck2-section">
      <div class="field-label b"><span class="pip"></span><span id="lbl-deck2"></span></div>

      <div class="tabpick" id="tabpick" hidden>
        <div class="tabpick-label" id="tabpick-label"></div>
        <div class="tabpick-list" id="tabpick-list"></div>
      </div>

      <div class="input-row">
        <div class="deck-search-wrap">
          <input class="mat-field" id="deck-url" type="text" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="deck-dropdown">
          <div class="deck-dropdown" id="deck-dropdown" role="listbox"></div>
        </div>
        <button class="mat-btn mat-btn--go" id="compare-btn">
          <span id="cmp-url-text"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <button type="button" class="hint" id="mox-hint"></button>
    </div>

    <button class="pool-entry" id="pool-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>
      <span id="pool-entry-text"></span> <span class="sub" id="pool-entry-sub"></span>
    </button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
